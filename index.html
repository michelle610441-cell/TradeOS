  <style>
:root {
  color-scheme: light;
  --ink: #101d45;
  --ink-soft: #516080;
  --paper: #f6f8fe;
  --white: #ffffff;
  --blue: #5865f2;
  --sun: #ffca58;
  --line: #dfe5f2;
  --shadow: 0 18px 50px rgba(25, 43, 92, .13);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #eaf0ff; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--ink);
  background: radial-gradient(circle at 14% 0%, rgba(154, 111, 255, .28), transparent 32rem), linear-gradient(155deg, #edf2ff 0%, #fff8fd 52%, #e8efff 100%);
}
button, textarea { font: inherit; }
.app-shell { width: min(100%, 680px); min-height: 100vh; margin: 0 auto; background: var(--paper); box-shadow: 0 0 70px rgba(25, 43, 92, .12); overflow: hidden; }

.hero {
  position: relative;
  padding: max(30px, env(safe-area-inset-top)) 22px 25px;
  color: var(--white);
  background: radial-gradient(circle at 94% 6%, rgba(255, 200, 227, .85) 0 2px, transparent 3px), radial-gradient(circle at 88% 16%, rgba(255, 217, 112, .7) 0 1px, transparent 2px), linear-gradient(135deg, #3147bd 0%, #6a49df 55%, #ee5d9f 145%);
  border-radius: 0 0 34px 34px;
  overflow: hidden;
}
.hero::after { content: ""; position: absolute; width: 210px; height: 210px; right: -115px; bottom: -130px; border: 38px solid rgba(255,255,255,.08); border-radius: 50%; }
.hero-topline, .week-switcher, .hero-note, .week-progress { position: relative; z-index: 1; }
.hero-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.eyebrow { margin: 0 0 6px; color: #e3dfff; font-size: .78rem; font-weight: 700; letter-spacing: .07em; }
h1 { margin: 0; font-size: 1.65rem; line-height: 1.2; letter-spacing: -.03em; }
.today-button { min-height: 38px; padding: 0 13px; color: white; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; font-size: .82rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(8px); }
.today-button:disabled { opacity: .45; cursor: default; }
.week-switcher { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 12px; margin-top: 31px; }
.week-arrow { display: grid; place-items: center; width: 46px; height: 46px; color: white; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 16px; cursor: pointer; }
.week-arrow:disabled { opacity: .25; cursor: default; }
.week-arrow svg { width: 21px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.week-display { text-align: center; }
.week-display > span { display: block; color: #e1dcff; font-size: .7rem; font-weight: 700; letter-spacing: .09em; }
.week-number-button { display: block; width: 100%; margin: 2px 0 3px; padding: 0; color: white; background: none; border: 0; font-size: 2rem; font-weight: 800; line-height: 1.1; letter-spacing: -.05em; cursor: pointer; }
.week-number-button::after { content: "⌄"; display: inline-block; margin-left: 7px; color: #ffd671; font-size: 1rem; transform: translateY(-3px); }
.week-display small { color: #eeeaff; font-size: .79rem; }
.week-progress { height: 4px; margin-top: 23px; overflow: hidden; background: rgba(255,255,255,.13); border-radius: 999px; }
.week-progress span { display: block; width: 6%; height: 100%; background: linear-gradient(90deg, #ffba32, #ffe39e); border-radius: inherit; transition: width .35s ease; }
.hero-note { margin: 11px 0 0; color: #eeeaff; font-size: .78rem; }

.view-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 18px 20px 0; padding: 5px; background: #e9edfa; border-radius: 16px; }
.view-tab { min-height: 42px; color: #68738e; background: transparent; border: 0; border-radius: 12px; font-size: .84rem; font-weight: 800; cursor: pointer; }
.view-tab.is-active { color: white; background: linear-gradient(135deg, #5865f2, #a34fd9); box-shadow: 0 8px 19px rgba(102, 79, 224, .25); }

.ai-plan-entry {
  display: grid;
  grid-template-columns: 42px 1fr 20px;
  align-items: center;
  gap: 11px;
  width: calc(100% - 40px);
  margin: 12px 20px 0;
  padding: 12px 14px;
  color: white;
  text-align: left;
  background: linear-gradient(120deg, #5b64eb, #9c4fdb 58%, #ee5c9c);
  border: 0;
  border-radius: 18px;
  box-shadow: 0 11px 25px rgba(101, 69, 205, .22);
  cursor: pointer;
}
.ai-mark { display: grid; place-items: center; width: 40px; height: 40px; color: #6847c9; background: linear-gradient(145deg, #fff7ca, #ffd569); border-radius: 13px; font-size: 1.2rem; }
.ai-plan-entry strong, .ai-plan-entry small { display: block; }
.ai-plan-entry strong { font-size: .87rem; }
.ai-plan-entry small { margin-top: 3px; color: rgba(255,255,255,.76); font-size: .68rem; }
.ai-arrow { color: rgba(255,255,255,.86); font-size: 1.6rem; font-weight: 300; }

.day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 14px 14px 5px; padding: 8px; background: var(--white); border: 1px solid #e7ebf5; border-radius: 20px; box-shadow: 0 8px 28px rgba(35, 54, 102, .06); }
.day-button { min-width: 0; min-height: 58px; padding: 7px 2px; color: #7b86a0; background: transparent; border: 0; border-radius: 14px; cursor: pointer; transition: transform .2s ease, background .2s ease, color .2s ease; }
.day-button span, .day-button strong { display: block; }
.day-button span { margin-bottom: 5px; font-size: .7rem; }
.day-button strong { font-size: .95rem; }
.day-button.has-course strong::after { content: ""; display: block; width: 4px; height: 4px; margin: 4px auto 0; background: #8f72ee; border-radius: 50%; }
.day-button.is-active { color: white; background: linear-gradient(145deg, #5965f2, #a653d7); box-shadow: 0 8px 18px rgba(92,87,224,.28); transform: translateY(-1px); }
.day-button.is-active strong::after { background: var(--sun); }
.day-button.is-today:not(.is-active) { color: var(--blue); background: #edf1ff; }
.day-button.is-holiday:not(.is-active) { color: #d14c86; background: #fff0f7; }
.day-button.is-holiday strong::after { content: "休"; display: block; width: auto; height: auto; margin: 2px auto 0; color: #d14c86; background: none; font-size: .52rem; line-height: 1; }
.day-button.is-holiday.is-active strong::after { color: #ffe08a; background: none; }

.content { padding: 21px 20px 36px; }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; min-height: 52px; margin-bottom: 18px; }
.section-date { margin: 0 0 2px; color: var(--ink-soft); font-size: .8rem; font-weight: 600; }
h2 { margin: 0; font-size: 1.55rem; letter-spacing: -.04em; }
.course-count { margin-bottom: 4px; color: #6b7691; font-size: .78rem; font-weight: 700; }
.next-card { position: relative; margin-bottom: 14px; padding: 18px 18px 17px; color: white; background: linear-gradient(135deg, #5965f2, #8e47ce); border-radius: 22px; box-shadow: 0 14px 32px rgba(91,82,220,.22); overflow: hidden; }
.next-card::after { content: ""; position: absolute; width: 74px; height: 74px; right: -18px; top: -22px; background: var(--sun); border-radius: 50%; opacity: .95; }
.next-label { margin: 0 0 8px; color: #dedcff; font-size: .72rem; font-weight: 800; letter-spacing: .1em; }
.next-name { margin: 0 76px 8px 0; font-size: 1.15rem; }
.next-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: #f5f3ff; font-size: .8rem; }
.schedule { display: grid; gap: 12px; }
.course-card { --course: #5865f2; position: relative; display: grid; grid-template-columns: 67px 1fr; gap: 15px; padding: 17px 17px 17px 15px; overflow: hidden; background: var(--white); border: 1px solid #e5eaf4; border-radius: 22px; box-shadow: 0 10px 26px rgba(37,55,101,.06); animation: card-in .35s ease both; }
.course-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--course-gradient); }
@keyframes card-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
.course-time { padding-right: 13px; border-right: 1px solid var(--line); }
.course-time strong { display: block; color: var(--course); font-size: .96rem; line-height: 1.1; }
.course-time span { display: block; margin-top: 5px; color: #7f8aa3; font-size: .72rem; line-height: 1.35; }
.course-period { margin-top: 9px !important; color: #52607c !important; font-weight: 700; }
.course-main { min-width: 0; }
.course-name-row { display: flex; align-items: flex-start; gap: 8px; }
.course-dot { flex: 0 0 auto; width: 9px; height: 9px; margin-top: 6px; background: var(--course); border-radius: 3px; transform: rotate(45deg); }
.course-name { margin: 0; font-size: 1rem; line-height: 1.4; }
.course-detail { display: flex; align-items: flex-start; gap: 7px; margin: 8px 0 0; color: #55617b; font-size: .8rem; line-height: 1.45; }
.course-detail svg { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.course-week { display: inline-block; margin-top: 10px; padding: 4px 8px; color: #56617a; background: #f1f4fa; border-radius: 8px; font-size: .7rem; font-weight: 700; }
.empty-state { padding: 38px 22px 34px; text-align: center; background: var(--white); border: 1px dashed #ccd5e7; border-radius: 24px; }
.empty-mark { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 15px; color: var(--blue); background: #edf1ff; border-radius: 19px; font-size: 1.45rem; }
.empty-state h3 { margin: 0 0 6px; font-size: 1rem; }
.empty-state p { margin: 0; color: #74809a; font-size: .82rem; line-height: 1.65; }
.empty-state button { margin-top: 18px; min-height: 42px; padding: 0 16px; color: white; background: var(--ink); border: 0; border-radius: 12px; font-weight: 700; cursor: pointer; }
.empty-state.is-holiday { border-color: #f0bfd4; background: linear-gradient(145deg, #fff8fb, #fff2f8); }
.empty-state.is-holiday .empty-mark { color: #c8417e; background: linear-gradient(145deg, #ffe8b3, #ffc7dc); }

.week-view { padding: 22px 0 36px; }
.week-view-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 20px; margin-bottom: 17px; }
.free-hint { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 4px; color: #7b849b; font-size: .7rem; white-space: nowrap; }
.free-hint i { width: 9px; height: 9px; background: #fff; border: 1px solid #dfe5f2; border-radius: 3px; }
.week-table-wrap { overflow-x: auto; padding: 0 10px 10px; overscroll-behavior-x: contain; }
.week-table { display: grid; grid-template-columns: 45px repeat(5, minmax(71px, 1fr)); grid-template-rows: 54px repeat(13, 62px); min-width: 400px; position: relative; }
.grid-corner, .grid-day, .grid-period, .grid-empty { background: #fff; border-right: 1px solid #e8ebf4; border-bottom: 1px solid #e8ebf4; }
.grid-corner { display: grid; place-items: center; position: sticky; left: 0; z-index: 4; color: #8a93a8; border-radius: 14px 0 0 0; font-size: .65rem; font-weight: 800; }
.grid-day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #263455; }
.grid-day strong { font-size: .78rem; }
.grid-day span { color: #8992a8; font-size: .61rem; }
.grid-day.is-today { color: #7149df; background: #f1edff; }
.grid-day.is-holiday { position: relative; color: #c53f7c; background: #fff0f6; }
.grid-day.is-holiday small { position: absolute; right: 5px; top: 4px; display: grid; place-items: center; width: 15px; height: 15px; color: #fff; background: linear-gradient(145deg, #f06a9d, #bd55e8); border-radius: 50%; font-size: .5rem; }
.grid-period { display: flex; flex-direction: column; align-items: center; justify-content: center; position: sticky; left: 0; z-index: 3; color: #74809b; }
.grid-period strong { color: #31405f; font-size: .74rem; }
.grid-period span { margin-top: 3px; font-size: .54rem; }
.grid-empty { background: linear-gradient(135deg, #fff, #fbfcff); }
.grid-empty.is-holiday { background: linear-gradient(135deg, #fff8fb, #fff0f6); }
.week-course { z-index: 2; margin: 2px; padding: 7px 5px; color: #fff; border-radius: 9px; box-shadow: 0 6px 14px rgba(53, 47, 120, .18); overflow: hidden; animation: card-in .32s ease both; }
.week-course strong, .week-course span, .week-course small { display: block; }
.week-course strong { font-size: .66rem; line-height: 1.32; }
.week-course span { margin-top: 5px; color: rgba(255,255,255,.92); font-size: .55rem; }
.week-course small { margin-top: 4px; color: rgba(255,255,255,.8); font-size: .54rem; line-height: 1.25; }
.scroll-hint { margin: 2px 0 0; color: #9099ad; text-align: center; font-size: .67rem; }

.sheet[hidden] { display: none; }
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .22s ease; }
.sheet.is-open { opacity: 1; }
.sheet-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(12, 17, 45, .54); border: 0; backdrop-filter: blur(3px); }
.sheet-panel { position: relative; width: min(100%, 680px); padding: 10px 20px calc(24px + var(--safe-bottom)); background: #f8f9fe; border-radius: 28px 28px 0 0; box-shadow: 0 -20px 60px rgba(15, 25, 70, .2); transform: translateY(25px); transition: transform .22s ease; }
.sheet.is-open .sheet-panel { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; margin: 0 auto 18px; background: #cdd3e2; border-radius: 99px; }
.sheet-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sheet-heading p { margin: 0 0 3px; color: #848da3; font-size: .7rem; }
.sheet-heading h2 { font-size: 1.25rem; }
.sheet-close { width: 36px; height: 36px; color: #6e7890; background: #e9ecf4; border: 0; border-radius: 50%; font-size: 1.35rem; cursor: pointer; }
.week-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; }
.week-options button { min-width: 0; aspect-ratio: 1; color: #56617a; background: #fff; border: 1px solid #e4e8f2; border-radius: 13px; cursor: pointer; }
.week-options button strong { display: block; font-size: .93rem; }
.week-options button span { display: block; margin-top: 1px; color: #9098aa; font-size: .58rem; }
.week-options button.is-selected { color: #fff; background: linear-gradient(135deg, #5865f2, #d154bb); border-color: transparent; box-shadow: 0 7px 16px rgba(118, 74, 215, .26); }
.week-options button.is-selected span { color: rgba(255,255,255,.8); }
.plan-label { display: block; margin-bottom: 8px; color: #33415f; font-size: .8rem; font-weight: 800; }
.plan-panel textarea { width: 100%; padding: 13px 14px; color: #263455; background: #fff; border: 1px solid #dfe4f0; border-radius: 15px; outline: 0; resize: none; font-size: .82rem; line-height: 1.6; }
.plan-panel textarea:focus { border-color: #8b62e5; box-shadow: 0 0 0 3px rgba(139,98,229,.12); }
.plan-tip { margin: 9px 2px 15px; color: #828ba1; font-size: .68rem; line-height: 1.5; }
.share-plan-button { width: 100%; min-height: 50px; color: #fff; background: linear-gradient(120deg, #5865f2, #a34fd9, #ed5b9b); border: 0; border-radius: 15px; box-shadow: 0 10px 24px rgba(105,75,205,.24); font-size: .88rem; font-weight: 800; cursor: pointer; }
.share-plan-button span { margin-right: 5px; color: #ffdd78; }

.footer { display: flex; justify-content: space-between; gap: 12px; padding: 20px 20px calc(24px + var(--safe-bottom)); color: #8a94aa; border-top: 1px solid #e4e9f3; font-size: .7rem; }
.toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); z-index: 30; max-width: calc(100% - 40px); padding: 11px 16px; color: white; background: rgba(16,29,69,.94); border-radius: 12px; box-shadow: var(--shadow); font-size: .82rem; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: .25s ease; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

@media (min-width: 681px) {
  body { padding: 26px 0; }
  .app-shell { min-height: calc(100vh - 52px); border-radius: 34px; }
  .hero { border-radius: 34px; }
}

@media (max-width: 370px) {
  .hero { padding-inline: 17px; }
  .content { padding-inline: 15px; }
  .view-tabs, .ai-plan-entry { margin-inline: 14px; }
  .ai-plan-entry { width: calc(100% - 28px); }
  .day-strip { margin-inline: 9px; gap: 2px; padding: 6px; }
  .day-button { min-height: 54px; }
  .course-card { grid-template-columns: 61px 1fr; gap: 12px; padding-inline: 13px; }
  .footer { flex-direction: column; }
  .week-options { gap: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

  </style>
</head>

  <main class="app-shell">
    <header class="hero">
      <div class="hero-topline">
        <div>
          <p class="eyebrow">2026—2027 · 第一学期</p>
          <h1>我的课表</h1>
        </div>
        <button class="today-button" id="todayButton" type="button">回到本周</button>
      </div>

      <div class="week-switcher" aria-label="切换教学周">
        <button class="week-arrow" id="prevWeek" type="button" aria-label="上一周">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="week-display" aria-live="polite">
          <span>已按日期自动定位 · 点击可切换</span>
          <button id="weekNumber" class="week-number-button" type="button" aria-label="选择教学周">第 1 周</button>
          <small id="weekRange">9月14日 — 9月20日</small>
        </div>
        <button class="week-arrow" id="nextWeek" type="button" aria-label="下一周">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="week-progress" aria-hidden="true"><span id="weekProgressBar"></span></div>
      <p class="hero-note" id="heroNote">新的一周，把注意力交给当下。</p>
    </header>

    <nav class="view-tabs" aria-label="课表视图">
      <button class="view-tab is-active" id="dayViewTab" type="button">今日课表</button>
      <button class="view-tab" id="weekViewTab" type="button">周课表</button>
    </nav>

    <button class="ai-plan-entry" id="aiPlanButton" type="button">
      <span class="ai-mark">✦</span>
      <span><strong>让 GPT 安排这一天</strong><small>自动带上课程和空闲时间</small></span>

    <div id="dayView">
      <section class="day-strip" id="dayStrip" aria-label="选择日期"></section>
      <section class="content" aria-live="polite">

          <div>
            <p class="section-date" id="sectionDate"></p>
            <h2 id="sectionTitle">今天</h2>

          <span class="course-count" id="courseCount"></span>

        <article class="next-card" id="nextCard" hidden></article>
        <div class="schedule" id="schedule"></div>

      <div class="week-view-heading">
        <div>

      <div class="week-table-wrap">
        <div class="week-table" id="weekTable"></div>

      <p class="scroll-hint">左右滑动可查看完整课表</p>
    </section>

    <footer class="footer">
      <span>上海外国语大学 · 松江校区</span>
      <span>无广告 · 本机运行</span>
    </footer>
  </main>

  <div class="sheet" id="weekPicker" hidden>
    <button class="sheet-backdrop" data-close="weekPicker" type="button" aria-label="关闭"></button>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-heading">
        <div><p>2026—2027 第一学期</p><h2 id="pickerTitle">跳转到教学周</h2></div>
        <button class="sheet-close" data-close="weekPicker" type="button" aria-label="关闭">×</button>
      </div>
      <div class="week-options" id="weekOptions"></div>
    </section>
  </div>

  <div class="sheet" id="planSheet" hidden>
    <button class="sheet-backdrop" data-close="planSheet" type="button" aria-label="关闭"></button>
    <section class="sheet-panel plan-panel" role="dialog" aria-modal="true" aria-labelledby="planTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-heading">
        <div><p id="planDateLabel">今天</p><h2 id="planTitle">交给 GPT 安排</h2></div>
        <button class="sheet-close" data-close="planSheet" type="button" aria-label="关闭">×</button>
      </div>
      <label class="plan-label" for="planTasks">今天还想完成什么？</label>
      <textarea id="planTasks" rows="5" placeholder="例如：背50个德语单词；复习高数第二章；晚上散步30分钟……"></textarea>
      <p class="plan-tip">课程会自动附上。点击后在分享列表中选择 ChatGPT，再发送即可。</p>
      <button class="share-plan-button" id="sharePlanButton" type="button"><span>✦</span> 打开 ChatGPT 安排</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  "use strict";

  const SEMESTER_START = new Date(2026, 8, 14);
  const TOTAL_WEEKS = 18;
  const dayNames = ["日", "一", "二", "三", "四", "五", "六"];
  const encouragement = [
    "新的一周，把注意力交给当下。",
    "稳定地走，知识会留下痕迹。",
    "先完成这一页，再去看更远的地方。",
    "今天的专注，会成为明天的底气。"
  ];
  const colors = [
    { solid: "#4568ff", gradient: "linear-gradient(145deg, #4169ff, #7b5cff)" },
    { solid: "#ff5f7e", gradient: "linear-gradient(145deg, #ff7a5c, #ff4f91)" },
    { solid: "#a14fe1", gradient: "linear-gradient(145deg, #9b5de5, #d05ce3)" },
    { solid: "#05a99a", gradient: "linear-gradient(145deg, #00b8a9, #25c5d9)" },
    { solid: "#eb8f13", gradient: "linear-gradient(145deg, #ffb21a, #ff7b32)" },
    { solid: "#df4689", gradient: "linear-gradient(145deg, #ed4d9a, #bd55e8)" },
    { solid: "#2588d1", gradient: "linear-gradient(145deg, #2798e8, #5865f2)" }
  ];

  const holidays = new Map([
    ["2026-9-25", "中秋节假期"],
    ["2026-9-26", "中秋节假期"],
    ["2026-9-27", "中秋节假期"],
    ["2026-10-1", "国庆节假期"],
    ["2026-10-2", "国庆节假期"],
    ["2026-10-3", "国庆节假期"],
    ["2026-10-4", "国庆节假期"],
    ["2026-10-5", "国庆节假期"],
    ["2026-10-6", "国庆节假期"],
    ["2026-10-7", "国庆节假期"]
  ]);

  const courses = [
    { day: 1, name: "基础德语Ⅱ", start: "08:15", end: "11:35", period: "第1–4节", weeks: [1, 17], room: "松江校区 3308–3309", teacher: "李晨", color: colors[0] },
    { day: 1, name: "中国现代文学", start: "13:00", end: "14:30", period: "第5–6节", weeks: [1, 17], room: "松江校区 8306–8308", teacher: "杜力", color: colors[1] },
    { day: 2, name: "综合英语Ⅴ", start: "08:15", end: "09:45", period: "第1–2节", weeks: [1, 16], room: "松江校区 5215–5216", teacher: "骆明琼", color: colors[2] },
    { day: 2, name: "体育 · 功夫扇", start: "13:00", end: "14:30", period: "第5–6节", weeks: [1, 17], room: "室内篮球馆羽毛球场", teacher: "刘海荣", color: colors[3] },
    { day: 2, name: "习近平新时代中国特色社会主义思想概论", start: "15:35", end: "17:50", period: "第8–10节", weeks: [1, 18], room: "松江校区 4420", teacher: "朱熠文", color: colors[1] },
    { day: 2, name: "理解艺术B：国画基础", start: "18:20", end: "20:35", period: "第11–13节", weeks: [8, 13], room: "松江校区 4110–4112", teacher: "杨爽", color: colors[6] },
    { day: 3, name: "德语写作Ⅰ", start: "13:00", end: "14:30", period: "第5–6节", weeks: [1, 17], room: "松江校区 3105–3106", teacher: "Sabrina M. Schwaiger", color: colors[0] },
    { day: 3, name: "德语视听说Ⅱ", start: "14:50", end: "16:20", period: "第7–8节", weeks: [1, 17], room: "图文信息中心 205 / 207", teacher: "马佳欣", color: colors[3] },
    { day: 4, name: "综合英语Ⅴ", start: "10:05", end: "11:35", period: "第3–4节", weeks: [1, 16], room: "松江校区 5215–5216", teacher: "骆明琼", color: colors[2] },
    { day: 4, name: "双学位 · 高等数学", start: "13:00", end: "16:20", period: "第5–8节", weeks: [1, 17], room: "松江校区 3314–3315", teacher: "徐静", color: colors[4] },
    { day: 4, name: "语言学概论", start: "16:30", end: "18:00", period: "第9–10节", weeks: [1, 17], room: "松江校区 3202–3203", teacher: "李双剑", color: colors[5] },
    { day: 5, name: "基础德语Ⅱ", start: "08:15", end: "11:35", period: "第1–4节", weeks: [1, 17], room: "松江校区 3308–3309", teacher: "李晨", color: colors[0] },
    { day: 5, name: "形势与政策", start: "16:30", end: "18:00", period: "第9–10节", weeks: [4, 7], room: "松江校区 3158–3159", teacher: "刘豪杰", color: colors[6] }
  ];

  const $ = id => document.getElementById(id);
  let now = new Date();
  let actualWeek = weekForDate(now);
  let selectedWeek = clamp(actualWeek, 1, TOTAL_WEEKS);
  let selectedDay = actualWeek >= 1 && actualWeek <= TOTAL_WEEKS ? now.getDay() : 1;
  let currentView = "day";
  let toastTimer;

  function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
  function toMinutes(time) { const [h, m] = time.split(":").map(Number); return h * 60 + m; }
  function fromMinutes(value) { return `${String(Math.floor(value / 60)).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`; }

  function weekForDate(date) {
    const dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const startOnly = new Date(SEMESTER_START.getFullYear(), SEMESTER_START.getMonth(), SEMESTER_START.getDate());
    return Math.floor((dateOnly - startOnly) / 86400000 / 7) + 1;
  }

  function dateFor(week, day) {
    const result = new Date(SEMESTER_START);
    result.setDate(result.getDate() + (week - 1) * 7 + (day === 0 ? 6 : day - 1));
    return result;
  }

  function formatMonthDay(date) { return `${date.getMonth() + 1}月${date.getDate()}日`; }
  function formatFullDate(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`; }
  function dateKey(date) { return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`; }
  function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function holidayForDate(date) { return holidays.get(dateKey(date)) || ""; }
  function activeCourses(day, week) {
    if (holidayForDate(dateFor(week, day))) return [];
    return courses.filter(course => course.day === day && week >= course.weeks[0] && week <= course.weeks[1]);
  }
  function escapeHtml(value) { return value.replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[ch]); }

  function iconPath(type) {
    const paths = {
      pin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>'
    };
    return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[type]}</svg>`;
  }

  function render() {
    const monday = dateFor(selectedWeek, 1);
    const sunday = dateFor(selectedWeek, 0);
    $("weekNumber").textContent = `第 ${selectedWeek} 周`;
    $("weekRange").textContent = `${formatMonthDay(monday)} — ${formatMonthDay(sunday)}`;
    $("weekProgressBar").style.width = `${(selectedWeek / TOTAL_WEEKS) * 100}%`;
    $("heroNote").textContent = encouragement[(selectedWeek - 1) % encouragement.length];
    $("prevWeek").disabled = selectedWeek === 1;
    $("nextWeek").disabled = selectedWeek === TOTAL_WEEKS;
    $("todayButton").disabled = selectedWeek === clamp(actualWeek, 1, TOTAL_WEEKS);
    renderDays();
    renderSchedule();
    renderWeekTable();
    renderView();
  }

  function jumpToCurrentWeek() {
    now = new Date();
    actualWeek = weekForDate(now);
    selectedWeek = clamp(actualWeek, 1, TOTAL_WEEKS);
    selectedDay = actualWeek >= 1 && actualWeek <= TOTAL_WEEKS ? now.getDay() : 1;
    render();
  }

  function renderDays() {
    const orderedDays = [1, 2, 3, 4, 5, 6, 0];
    $("dayStrip").innerHTML = orderedDays.map(day => {
      const date = dateFor(selectedWeek, day);
      const holiday = holidayForDate(date);
      const hasCourse = activeCourses(day, selectedWeek).length > 0;
      const classes = ["day-button", day === selectedDay ? "is-active" : "", isSameDay(date, now) ? "is-today" : "", hasCourse ? "has-course" : "", holiday ? "is-holiday" : ""].filter(Boolean).join(" ");
      return `<button class="${classes}" type="button" data-day="${day}" aria-pressed="${day === selectedDay}"${holiday ? ` aria-label="${formatMonthDay(date)}，${holiday}"` : ""}><span>周${dayNames[day]}</span><strong>${date.getDate()}</strong></button>`;
    }).join("");
    $("dayStrip").querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
      selectedDay = Number(button.dataset.day);
      render();
    }));
  }

  function renderSchedule() {
    const date = dateFor(selectedWeek, selectedDay);
    const holiday = holidayForDate(date);
    const items = activeCourses(selectedDay, selectedWeek);
    const isToday = isSameDay(date, now);
    $("sectionDate").textContent = `${formatMonthDay(date)} · 星期${dayNames[selectedDay]}`;
    $("sectionTitle").textContent = holiday || (isToday ? "今天" : `星期${dayNames[selectedDay]}`);
    $("courseCount").textContent = holiday ? "假期无课" : (items.length ? `${items.length} 门课` : "全天无课");
    renderNextCard(items, isToday);

    if (!items.length) {
      const next = findNextCourse(date);
      const emptyTitle = holiday || (selectedDay === 0 || selectedDay === 6 ? "周末愉快" : "今天没有课");
      const emptyText = holiday ? "今天的课程已经留空，祝你假期愉快。" : (next ? `下一门是${formatMonthDay(next.date)}的「${next.course.name}」` : "给自己留一点完整的休息时间。");
      $("schedule").innerHTML = `<div class="empty-state${holiday ? " is-holiday" : ""}"><div class="empty-mark">${holiday ? "休" : "✓"}</div><h3>${emptyTitle}</h3><p>${emptyText}</p>${!holiday && next ? '<button type="button" id="jumpNext">查看下一门课</button>' : ""}</div>`;
      $("jumpNext")?.addEventListener("click", () => { selectedWeek = next.week; selectedDay = next.course.day; render(); });
      return;
    }
    $("schedule").innerHTML = items.map((course, index) => courseCard(course, index)).join("");
  }

  function renderNextCard(items, isToday) {
    const card = $("nextCard");
    if (!isToday || !items.length) { card.hidden = true; return; }
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const upcoming = items.find(course => toMinutes(course.end) > currentMinutes);
    if (!upcoming) { card.hidden = true; return; }
    const started = toMinutes(upcoming.start) <= currentMinutes;
    card.hidden = false;
    card.innerHTML = `<p class="next-label">${started ? "正在上课" : "下一节"}</p><h3 class="next-name">${escapeHtml(upcoming.name)}</h3><div class="next-meta"><span>${upcoming.start}–${upcoming.end}</span><span>${escapeHtml(upcoming.room)}</span></div>`;
  }

  function courseCard(course, index) {
    return `<article class="course-card" style="--course:${course.color.solid};--course-gradient:${course.color.gradient};animation-delay:${index * 45}ms"><div class="course-time"><strong>${course.start}</strong><span>至 ${course.end}</span><span class="course-period">${course.period}</span></div><div class="course-main"><div class="course-name-row"><span class="course-dot" aria-hidden="true"></span><h3 class="course-name">${escapeHtml(course.name)}</h3></div><p class="course-detail">${iconPath("pin")}<span>${escapeHtml(course.room)}</span></p><p class="course-detail">${iconPath("user")}<span>${escapeHtml(course.teacher)}</span></p><span class="course-week">第${course.weeks[0]}–${course.weeks[1]}周</span></div></article>`;
  }

  function periodRange(course) {
    const match = course.period.match(/第(\d+)[–-](\d+)节/);
    return match ? [Number(match[1]), Number(match[2])] : [1, 1];
  }

  function renderWeekTable() {
    const periodStarts = ["08:15", "09:00", "10:05", "10:50", "13:00", "13:45", "14:50", "15:35", "16:30", "17:15", "18:20", "19:05", "19:50"];
    const weekdayNames = ["一", "二", "三", "四", "五"];
    const monday = dateFor(selectedWeek, 1);
    const friday = dateFor(selectedWeek, 5);
    $("weekViewDate").textContent = `第 ${selectedWeek} 周 · ${formatMonthDay(monday)}—${formatMonthDay(friday)}`;
    let html = '<div class="grid-corner">节次</div>';
    weekdayNames.forEach((name, index) => {
      const date = dateFor(selectedWeek, index + 1);
      const holiday = holidayForDate(date);
      html += `<div class="grid-day${isSameDay(date, now) ? " is-today" : ""}${holiday ? " is-holiday" : ""}"><strong>周${name}</strong><span>${date.getMonth() + 1}/${date.getDate()}</span>${holiday ? "<small>休</small>" : ""}</div>`;
    });
    periodStarts.forEach((time, index) => {
      html += `<div class="grid-period" style="grid-row:${index + 2};grid-column:1"><strong>${index + 1}</strong><span>${time}</span></div>`;
      for (let day = 1; day <= 5; day += 1) {
        const holiday = holidayForDate(dateFor(selectedWeek, day));
        html += `<div class="grid-empty${holiday ? " is-holiday" : ""}" style="grid-row:${index + 2};grid-column:${day + 1}"></div>`;
      }
    });
    courses.filter(course => course.day <= 5 && selectedWeek >= course.weeks[0] && selectedWeek <= course.weeks[1] && !holidayForDate(dateFor(selectedWeek, course.day))).forEach(course => {
      const [start, end] = periodRange(course);
      const shortRoom = course.room.replace("松江校区 ", "");
      html += `<article class="week-course" style="grid-column:${course.day + 1};grid-row:${start + 1}/${end + 2};background:${course.color.gradient}"><strong>${escapeHtml(course.name)}</strong><span>${course.start}–${course.end}</span><small>${escapeHtml(shortRoom)}</small></article>`;
    });
    $("weekTable").innerHTML = html;
  }

  function renderView() {
    const isWeek = currentView === "week";
    $("dayView").hidden = isWeek;
    $("weekView").hidden = !isWeek;
    $("dayViewTab").classList.toggle("is-active", !isWeek);
    $("weekViewTab").classList.toggle("is-active", isWeek);
  }

  function findNextCourse(afterDate) {
    for (let offset = 1; offset <= 28; offset += 1) {
      const date = new Date(afterDate);
      date.setDate(date.getDate() + offset);
      const week = weekForDate(date);
      if (week < 1 || week > TOTAL_WEEKS) continue;
      const dayCourses = activeCourses(date.getDay(), week);
      if (dayCourses.length) return { date, week, course: dayCourses[0] };
    }
    return null;
  }

  function showSheet(id) {
    const sheet = $(id);
    sheet.hidden = false;
    requestAnimationFrame(() => sheet.classList.add("is-open"));
  }

  function closeSheet(id) {
    const sheet = $(id);
    sheet.classList.remove("is-open");
    setTimeout(() => { sheet.hidden = true; }, 220);
  }

  function openWeekPicker() {
    $("weekOptions").innerHTML = Array.from({ length: TOTAL_WEEKS }, (_, index) => {
      const week = index + 1;
      return `<button type="button" data-week="${week}" class="${week === selectedWeek ? "is-selected" : ""}"><strong>${week}</strong><span>周</span></button>`;
    }).join("");
    $("weekOptions").querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
      selectedWeek = Number(button.dataset.week);
      closeSheet("weekPicker");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      showToast(`已跳转到第${selectedWeek}周`);
    }));
    showSheet("weekPicker");
  }

  function getSavedTasks(date) {
    try { return JSON.parse(localStorage.getItem("mingli-plan-tasks") || "{}")[dateKey(date)] || ""; } catch { return ""; }
  }

  function saveTasks(date, value) {
    try {
      const saved = JSON.parse(localStorage.getItem("mingli-plan-tasks") || "{}");
      saved[dateKey(date)] = value;
      localStorage.setItem("mingli-plan-tasks", JSON.stringify(saved));
    } catch {}
  }

  function openPlanSheet() {
    const date = dateFor(selectedWeek, selectedDay);
    $("planDateLabel").textContent = `${formatFullDate(date)} · 星期${dayNames[selectedDay]}`;
    $("planTasks").value = getSavedTasks(date);
    showSheet("planSheet");
    setTimeout(() => $("planTasks").focus(), 260);
  }

  function freeSlots(items) {
    const startOfDay = 7 * 60 + 30;
    const endOfDay = 22 * 60 + 30;
    let cursor = startOfDay;
    const slots = [];
    [...items].sort((a, b) => toMinutes(a.start) - toMinutes(b.start)).forEach(course => {
      const start = toMinutes(course.start);
      const end = toMinutes(course.end);
      if (start > cursor) slots.push(`${fromMinutes(cursor)}–${fromMinutes(start)}`);
      cursor = Math.max(cursor, end);
    });
    if (cursor < endOfDay) slots.push(`${fromMinutes(cursor)}–${fromMinutes(endOfDay)}`);
    return slots;
  }

  function buildPlanPrompt() {
    const date = dateFor(selectedWeek, selectedDay);
    const holiday = holidayForDate(date);
    const items = activeCourses(selectedDay, selectedWeek);
    const courseText = holiday ? `- ${holiday}，今天没有固定课程` : (items.length ? items.map(course => `- ${course.start}–${course.end} ${course.name}（${course.room}）`).join("\n") : "- 今天没有课程");
    const tasks = $("planTasks").value.trim() || "没有补充任务，请根据德语专业学生的日常学习需要安排复习、预习和休息。";
    const slots = freeSlots(items).join("、");
    return `请为我制定一份切实可执行的每日学习计划。\n\n日期：${formatFullDate(date)}，星期${dayNames[selectedDay]}，第${selectedWeek}教学周。\n我的固定课程：\n${courseText}\n\n可利用的时间段（7:30—22:30范围内）：${slots}\n\n我今天还想完成：\n${tasks}\n\n我是大学德语专业学生。请优先安排德语学习，并兼顾英语、课程作业和休息。不要占用上课时间；预留三餐、通勤和缓冲时间；连续专注尽量控制在45—60分钟。请用“时间｜任务｜完成标准”的中文表格输出，最后只补充3条执行提醒。`;
  }

  async function copyText(text) {
    if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }

  async function sharePlan() {
    const date = dateFor(selectedWeek, selectedDay);
    saveTasks(date, $("planTasks").value);
    const text = buildPlanPrompt();
    try {
      if (navigator.share) {
        await navigator.share({ title: "请帮我安排今日学习计划", text });
        closeSheet("planSheet");
        return;
      }
      await copyText(text);
      closeSheet("planSheet");
      showToast("计划要求已复制，请打开 ChatGPT 粘贴");
    } catch (error) {
      if (error?.name !== "AbortError") {
        await copyText(text);
        closeSheet("planSheet");
        showToast("已复制，请打开 ChatGPT 粘贴");
      }
    }
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    $("toast").textContent = message;
    $("toast").classList.add("show");
    toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
  }

  $("prevWeek").addEventListener("click", () => { if (selectedWeek > 1) { selectedWeek -= 1; render(); } });
  $("nextWeek").addEventListener("click", () => { if (selectedWeek < TOTAL_WEEKS) { selectedWeek += 1; render(); } });
  $("todayButton").addEventListener("click", jumpToCurrentWeek);
  $("dayViewTab").addEventListener("click", () => { currentView = "day"; renderView(); });
  $("weekViewTab").addEventListener("click", () => { currentView = "week"; renderView(); });
  $("weekNumber").addEventListener("click", openWeekPicker);
  $("aiPlanButton").addEventListener("click", openPlanSheet);
  $("sharePlanButton").addEventListener("click", sharePlan);
  $("planTasks").addEventListener("input", () => saveTasks(dateFor(selectedWeek, selectedDay), $("planTasks").value));
  document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => closeSheet(button.dataset.close)));
  window.addEventListener("pageshow", jumpToCurrentWeek);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) jumpToCurrentWeek(); });

  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister())).catch(() => {});
  if ("caches" in window) caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {});

  if (document.modelContext?.registerTool) {
    const lifecycle = new AbortController();
    Promise.resolve(document.modelContext.registerTool({
      name: "view_teaching_week",
      title: "查看教学周",
      description: "切换课表到指定教学周，并显示指定星期。",
      inputSchema: { type: "object", properties: { week: { type: "integer", minimum: 1, maximum: 18 }, day: { type: "integer", minimum: 0, maximum: 6 } }, required: ["week"], additionalProperties: false },
      annotations: { readOnlyHint: false, untrustedContentHint: false },
      execute(input) {
        if (!Number.isInteger(input?.week) || input.week < 1 || input.week > 18) throw new Error("教学周必须是1到18之间的整数");
        if (input.day !== undefined && (!Number.isInteger(input.day) || input.day < 0 || input.day > 6)) throw new Error("星期必须是0到6之间的整数");
        selectedWeek = input.week;
        if (input.day !== undefined) selectedDay = input.day;
        render();
        showToast(`已切换到第${selectedWeek}周`);
        return { week: selectedWeek, day: selectedDay, courses: activeCourses(selectedDay, selectedWeek).map(course => course.name) };
      }
    }, { signal: lifecycle.signal })).catch(() => {});
  }

  render();
})();

  </script>
</body>
</html>
