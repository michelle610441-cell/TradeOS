<style>
:root{
  --blue:#2563eb;--cyan:#06b6d4;--purple:#7c3aed;--ink:#10205a;--muted:#7f8db5;
  --line:#dfe7ff;--glass:rgba(255,255,255,.78)
}
*{box-sizing:border-box}
html{background:#edf3ff}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--ink);min-height:100vh;background:
  radial-gradient(circle at 10% 20%,rgba(37,99,235,.16),transparent 28%),
  radial-gradient(circle at 88% 12%,rgba(124,58,237,.18),transparent 30%),
  linear-gradient(135deg,#eef6ff 0%,#f7f3ff 48%,#edf8ff 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;background:linear-gradient(120deg,transparent 35%,rgba(59,130,246,.08),rgba(139,92,246,.12),transparent 65%);background-size:220% 220%;animation:flow 14s ease-in-out infinite}
@keyframes flow{0%{background-position:0% 50%;transform:rotate(0deg) scale(1)}50%{background-position:100% 50%;transform:rotate(3deg) scale(1.04)}100%{background-position:0% 50%;transform:rotate(0deg) scale(1)}}
header{position:sticky;top:0;z-index:20;color:white;padding:13px 22px;background:linear-gradient(105deg,#08184d,#123da8 42%,#5b21b6 78%,#2563eb);background-size:220% 220%;animation:headerFlow 9s ease-in-out infinite;box-shadow:0 8px 30px rgba(30,64,175,.22);display:flex;align-items:center;gap:22px;min-height:72px;overflow:hidden}header:after{content:"";position:absolute;left:-15%;right:-15%;bottom:-42px;height:80px;background:linear-gradient(90deg,transparent,rgba(103,232,249,.42),rgba(196,181,253,.45),transparent);filter:blur(18px);animation:beam 6s linear infinite}.brand{display:flex;align-items:center;gap:11px;min-width:210px;position:relative;z-index:1}.brandMark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#22d3ee,#4f46e5,#a855f7);display:grid;place-items:center;font-size:25px;font-weight:800;box-shadow:0 8px 22px rgba(56,189,248,.28)}h1{font-size:22px;margin:0 0 2px;letter-spacing:.2px}.sub{font-size:12px;opacity:.82}.headerTip{position:relative;z-index:1;margin:auto;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 28px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);font-size:14px}.headerMeta{position:relative;z-index:1;font-size:12px;opacity:.78;white-space:nowrap}.shell{display:flex;min-height:calc(100vh - 72px)}.sidebar{width:218px;flex:0 0 218px;padding:18px 13px 20px;background:linear-gradient(180deg,rgba(6,23,76,.98),rgba(20,38,106,.98) 55%,rgba(48,24,112,.98));box-shadow:8px 0 28px rgba(30,41,110,.15);display:flex;flex-direction:column;position:sticky;top:72px;height:calc(100vh - 72px);z-index:10}.sideTitle{color:rgba(255,255,255,.65);font-size:12px;letter-spacing:1.5px;padding:2px 13px 12px}.sidebar nav{display:flex;flex-direction:column;gap:5px;padding:0;background:none;backdrop-filter:none;position:static;border:0;box-shadow:none;overflow:visible}.sidebar nav button{width:100%;border:1px solid transparent;background:transparent;color:rgba(235,242,255,.78);border-radius:12px;padding:10px 12px;text-align:left;white-space:nowrap;font-size:14px;font-weight:600;box-shadow:none;transition:.2s}.sidebar nav button:hover{background:rgba(255,255,255,.08);color:white}.sidebar nav button.on{color:white;border-color:rgba(129,140,248,.45);background:linear-gradient(100deg,#2563eb,#4f46e5,#7c3aed);background-size:180% 180%;animation:buttonFlow 4s ease infinite;box-shadow:0 7px 18px rgba(79,70,229,.3)}.sideBottom{margin-top:auto;color:rgba(255,255,255,.62);font-size:12px;padding:13px;border-top:1px solid rgba(255,255,255,.1)}.sideBottom span{display:block;font-size:10px;margin-top:5px;opacity:.7}main{flex:1;min-width:0;max-width:none;margin:auto;padding:22px 24px 90px}.card{position:relative;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.82);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 12px 35px rgba(48,76,150,.11)}
.card:before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.55),transparent 45%,rgba(124,58,237,.05));}
h2{font-size:18px;margin:0 0 12px;color:#172b6b}h3{color:#263f8a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
label{font-size:12px;color:#4d6295;display:block;margin-bottom:5px;font-weight:600}input,select,textarea{width:100%;border:1px solid #cfdafa;border-radius:11px;padding:10px 11px;font-size:15px;background:rgba(255,255,255,.88);color:#182b63;outline:none;transition:.18s}input:focus,select:focus,textarea:focus{border-color:#6d7ff2;box-shadow:0 0 0 3px rgba(99,102,241,.12)}textarea{min-height:90px;resize:vertical}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:650;color:#fff;background:linear-gradient(105deg,#2563eb,#4f46e5,#7c3aed);background-size:180% 180%;animation:buttonFlow 5s ease infinite;margin:4px 5px 4px 0;box-shadow:0 6px 15px rgba(79,70,229,.2);transition:transform .15s}.btn:active{transform:translateY(1px)}.btn.alt{color:#31529b;background:linear-gradient(135deg,#f4f8ff,#f3efff);border:1px solid #d7e0fa;box-shadow:none}.btn.danger{background:linear-gradient(105deg,#e11d48,#be123c);animation:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#e9efff;font-size:12px;color:#36539a}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.stat{font-size:25px;font-weight:750;color:#3046a4}.muted{color:#7e8eb5;font-size:12px;line-height:1.7;margin:6px 0 10px}.hint{color:#9aa6c2;font-size:12px;line-height:1.6;margin:4px 0 9px;padding-left:2px}.check{display:flex;gap:8px;align-items:center;padding:6px 0;color:#304675}.check input{width:auto;accent-color:#4f46e5}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;overflow:hidden;border:1px solid #dfe7ff;border-radius:12px;background:rgba(255,255,255,.55)}th,td{border-bottom:1px solid #e7ecfa;padding:9px;text-align:left;vertical-align:top}th{color:#526aa2;background:rgba(232,238,255,.7)}tr:last-child td{border-bottom:0}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:linear-gradient(105deg,#1d4ed8,#6d28d9);color:white;padding:10px 15px;border-radius:12px;display:none;z-index:20;box-shadow:0 10px 28px rgba(37,50,140,.28)}
small{color:#7889b1}.small{padding:6px 10px;font-size:12px}
@media(max-width:700px){header{padding-left:14px}main{padding-left:10px;padding-right:10px}.card{padding:14px;border-radius:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.tableWrap{overflow-x:auto;border:1px solid rgba(205,216,248,.8);border-radius:14px;background:rgba(255,255,255,.58);box-shadow:0 6px 18px rgba(48,76,150,.06)}.tableWrap table{border:0;margin:0;border-radius:0;min-width:650px}.statsTable th{background:linear-gradient(135deg,#edf4ff,#f2edff);color:#31498c}.statsTable td:first-child{color:#263f8a}.statsTable tr:hover td{background:rgba(238,242,255,.55)}
@media (max-width:820px){header{padding:11px 14px;min-height:64px}.headerTip{display:none}.brand{min-width:0}.headerMeta{margin-left:auto}.shell{min-height:calc(100vh - 64px)}.sidebar{width:190px;flex-basis:190px;top:64px;height:calc(100vh - 64px)}main{padding:16px 14px 80px}}
@media (max-width:680px){.sidebar{width:76px;flex-basis:76px;padding:12px 8px}.sideTitle,.sideBottom{display:none}.sidebar nav button{font-size:0;text-align:center;padding:11px 4px}.sidebar nav button:before{content:attr(data-num);font-size:15px}.headerMeta{display:none}.brandMark{width:38px;height:38px}.brand h1{font-size:19px}}
</style>
</head>
<body>
<header><div class="brand"><div class="brandMark">↗</div><div><h1>TradeOS</h1><div class="sub">记录 · 复盘 · 成长</div></div></div><div class="headerTip">✦ 好的交易，源于清晰的记录。</div><div class="headerMeta">A股 · V2.7.1 · 账户系统</div></header><div class="shell"><aside class="sidebar"><div class="sideTitle">交易SOP</div><nav id="nav"></nav><div class="sideBottom"><div>TradeOS</div><span>iPad 优先 · 本地存储</span></div></aside><main id="app"></main></div><div class="toast" id="toast"></div>
<script>
const STEPS=["交易日","①宏观","②大盘","③大势","④情绪","⑤板块","⑥个股","⑦买点","⑧仓位","⑨持仓","⑩卖出","⑪复盘/博主","⑫统计","⑬龙虎榜"];
const phases=["启动","加速","高潮","分歧","退潮","冰点","修复"];
const models=["龙头高位横盘二波","强势板块延续","断板反包","强势板块补涨套利","大阳回踩","分时强弱","KDJ趋势","其他"];
let db, currentStep=0, selectedDayId=null, state={days:[],bloggers:[]};

function showToast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function today(){return new Date().toISOString().slice(0,10)}
function save(){let s=JSON.stringify(state);localStorage.setItem("tradeos_v2",s);localStorage.setItem("tradeos_v2_6_complete",s);localStorage.setItem("tradeos_v2_7",s);localStorage.setItem("tradeos_v2_7_1",s)}
function load(){try{let raw=localStorage.getItem("tradeos_v2_7_1")||localStorage.getItem("tradeos_v2_7")||localStorage.getItem("tradeos_v2_6_complete")||localStorage.getItem("tradeos_v2")||localStorage.getItem("tradeos_v1");if(raw){let x=JSON.parse(raw);state=(x&&Array.isArray(x.days))?x:migratePayload(x)}}catch(e){}}
function day(){return state.days.find(x=>x.id===selectedDayId)||state.days[0]||null}
function selectDay(id){selectedDayId=id;currentStep=0;render()}
function prevDay(){let i=state.days.findIndex(x=>x.id===selectedDayId);if(i>=0 && state.days[i+1]){selectedDayId=state.days[i+1].id;currentStep=0;render()}}
function nextDay(){let i=state.days.findIndex(x=>x.id===selectedDayId);if(i>0){selectedDayId=state.days[i-1].id;currentStep=0;render()}}
function newDay(){
 let prev=state.days[0]||null;
 let d={id:id(),date:today(),createdAt:new Date().toISOString(),macro:{},market:{},trend:{},emotion:{phase:""},sector:{},stocks:[],currentStockId:null,buy:{},position:{},holdings:[],sell:{},review:{},bloggerLogs:[],trades:[],ledger:[],account:{initialCapital:"",cash:"",deposit:0,withdraw:0,note:""},accountSnapshot:{},leaderboard:{institutions:[],hotMoney:[],notes:""}};
 if(prev){
   d.holdings=(prev.holdings||[]).filter(h=>Number(h.qty)>0).map(h=>({...h,id:id(),inheritedFrom:prev.date}));
   d.account.initialCapital=prev.account?.initialCapital||"";
   d.account.cash=prev.account?.cash??"";
 }
 state.days.unshift(d);selectedDayId=d.id;recomputeAccount(d);save();showToast("已建立今日交易日档案，并继承上一交易日持仓");render()
}
function ensure(){
 if(!day()){newDay();return}
 if(!selectedDayId)selectedDayId=state.days[0].id;
 state.days.forEach(d=>{
   if(!Array.isArray(d.stocks)){
     d.stocks=[];
     if(d.stock && (d.stock.name||d.stock.code||d.stock.model)) d.stocks.push({...d.stock,id:d.stock.id||id()});
   }
   d.currentStockId=d.currentStockId || (d.stocks[0]&&d.stocks[0].id) || null;
   d.trades=d.trades||[];
   d.sell=d.sell||{};
   d.review=d.review||{};
   d.bloggerLogs=d.bloggerLogs||[];
   d.holdings=d.holdings||[];
   d.ledger=d.ledger||[];
   d.account=d.account||{initialCapital:"",cash:"",deposit:0,withdraw:0,note:""};
   d.accountSnapshot=d.accountSnapshot||{};
   d.leaderboard=d.leaderboard||{institutions:[],hotMoney:[],notes:""};
   d.leaderboard.institutions=d.leaderboard.institutions||[];
   d.leaderboard.hotMoney=d.leaderboard.hotMoney||[];
   d.stocks.forEach(st=>{ st.buy=st.buy||{}; st.position=st.position||{}; });
   // 兼容旧版：如果旧版只有全局买点/仓位，则迁移到当前股票一次。
   if(d.stocks.length && d.buy && Object.keys(d.buy).length && !d.stocks.some(st=>Object.keys(st.buy||{}).length)){
     d.stocks[0].buy={...d.buy}; d.stocks[0].position={...(d.position||{})};
   }
 });
}
function setPath(obj,key,val){obj[key]=val;save()}
function field(obj,key,label,type="text",placeholder=""){let v=obj[key]??"";return `<div><label>${label}</label><input data-obj="${obj.__name||""}" data-key="${key}" type="${type}" value="${String(v).replaceAll('"','&quot;')}" placeholder="${placeholder}"></div>`}
function nav(){document.getElementById("nav").innerHTML=STEPS.map((x,i)=>`<button data-num="${i===0?'⌂':i}" class="${i===currentStep?'on':''}" onclick="currentStep=${i};render()">${x}</button>`).join("")}
function wrap(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function text(obj,key,label,ph=""){return `<div><label>${label}</label>${ph?`<p class="hint">${ph}</p>`:""}<textarea data-key="${key}" data-area="${obj._id}" placeholder="${ph}">${obj[key]||""}</textarea></div>`}
function input(obj,key,label,type="text"){let hints={"股票名称":"填写准备研究/交易的个股。","代码":"填写A股代码，便于复盘定位。","同花顺热度榜排名":"手动填写热度榜排名；≤100才进入候选池。","主流板块":"先写当前最强/最主流方向。","涨停家数":"手动统计板块内涨停家数。","资金流向":"填写流入/流出，并记录你的判断依据。","昨日领涨今日延续性":"重点看昨日领涨板块今天是否继续加强。","计划买入价":"不要把追高当作买点；记录你真正愿意成交的价格。","计划止损":"写清楚结构失效的位置。","确定性评分":"用你的主观确定性衡量仓位，而不是事后解释。","计划仓位 %":"先写计划，再填写实际仓位。","实际仓位 %":"记录真实成交后的仓位。","卖出价":"填写实际成交价。","实际收益率 %":"平仓后填写，供统计使用。"};return `<div><label>${label}</label>${hints[label]?`<p class="hint">${hints[label]}</p>`:""}<input data-key="${key}" data-area="${obj._id}" type="${type}" value="${obj[key]??""}"></div>`}
function select(obj,key,label,opts){let hints={phase:"情绪阶段决定策略节奏：启动看机会，分歧找强者，高潮做止盈。",model:"选择与你实际执行最接近的交易模式，便于之后统计。",action:"动作只是纪律提示，最终判断仍由你完成。"};return `<div><label>${label}</label>${hints[key]?`<p class="hint">${hints[key]}</p>`:""}<select data-key="${key}" data-area="${obj._id}"><option value="">请选择</option>${opts.map(x=>`<option ${obj[key]===x?"selected":""}>${x}</option>`).join("")}</select></div>`}
function bindArea(obj){obj._id=obj._id||id();return obj}

function stocksOf(d){return Array.isArray(d.stocks)?d.stocks:[]}
function currentStock(d){return stocksOf(d).find(x=>x.id===d.currentStockId)||stocksOf(d)[0]||null}
function newStock(){let d=day(),s={id:id(),name:"",code:"",hot:"",model:"",leader:false,ma:false,limit10:false,board2:false,sectorStrong:false,top100:false,notes:"",buy:{phase:"",price:"",planStop:"",confidence:"",notes:""},position:{plan:"",actual:"",reason:""}};d.stocks.push(s);d.currentStockId=s.id;save();render();}
function selectStock(id){let d=day();d.currentStockId=id;save();render()}
function deleteStock(id){let d=day();d.stocks=stocksOf(d).filter(x=>x.id!==id);if(d.currentStockId===id)d.currentStockId=d.stocks[0]?.id||null;save();render()}
function stockModel(id){let d=day(),s=stocksOf(d).find(x=>x.id===id);return s?.model||""}
function changeTradeModel(i,val){let d=day(),t=(d.trades||[])[i];if(t){t.model=val;t.modelEdited=true;save();render()}}
function render(){
 nav(); ensure(); let d=day(), a=document.getElementById("app");
 if(currentStep===0){a.innerHTML=wrap("交易日档案",`<div class="grid"><div><label>当前交易日</label><input value="${d.date}" id="date"></div><div><label>创建时间</label><input value="${new Date(d.createdAt).toLocaleString()}" disabled></div></div><p class="muted">每天建立一份完整的①～⑬记录。所有内容自动保存在本设备。</p><div class="row"><button class="btn" onclick="newDay()">＋新建交易日</button><button class="btn alt" onclick="exportData()">导出JSON备份</button><button class="btn alt" onclick="importData()">导入JSON</button></div><div class="row" style="margin-top:10px"><button class="btn alt" onclick="prevDay()">← 上一天</button><button class="btn alt" onclick="nextDay()">下一天 →</button></div>${state.days.length?`<h2 style="margin-top:16px">历史交易日</h2><table><tr><th>日期</th><th>情绪</th><th>市场</th><th>交易笔数</th><th>操作</th></tr>${state.days.map(x=>`<tr><td>${x.date}</td><td>${x.emotion.phase||"-"}</td><td>${x.market.final||"-"}</td><td>${(x.trades||[]).length}</td><td><button class="btn small" onclick="selectDay('${x.id}')">查看</button></td></tr>`).join("")}</table>`:""}`)}
 else if(currentStep===1)a.innerHTML=sectionArea(d,"macro","① 宏观","宏观环境、政策、流动性、外围市场与自己的判断。");
 else if(currentStep===2)a.innerHTML=marketPage(d);
 else if(currentStep===3)a.innerHTML=sectionArea(d,"trend","③ 大势","趋势方向、指数结构、风险偏好与操作环境。");
 else if(currentStep===4)a.innerHTML=emotionPage(d);
 else if(currentStep===5)a.innerHTML=sectorPage(d);
 else if(currentStep===6)a.innerHTML=stockPage(d);
 else if(currentStep===7)a.innerHTML=buyPage(d);
 else if(currentStep===8)a.innerHTML=positionPage(d);
 else if(currentStep===9)a.innerHTML=holdPage(d);
 else if(currentStep===10)a.innerHTML=sellPage(d);
 else if(currentStep===11)a.innerHTML=reviewPage(d);
 else if(currentStep===12)a.innerHTML=statsPage();
 else a.innerHTML=leaderboardPage(d);
 bind();
}
function sectionArea(d,key,title,desc){let o=bindArea(d[key]);return wrap(title,`<p class="muted">${desc}</p><p class="hint">先写你的判断，不自动抓新闻；把“结论”和“风险”写成当天可复盘的具体判断。</p><div class="grid">${input(o,"conclusion","核心结论")} ${input(o,"rating","主观评级")} ${input(o,"risk","主要风险")}</div>${text(o,"notes","详细分析")}<button class="btn" onclick="save();showToast('已自动保存')">保存</button>`)}
function marketPage(d){
 let o=bindArea(d.market);let checks=[["vol2","大盘量比 ≥ 2.0"],["up3800","上涨家数 > 3800"],["strong3","强势板块有3个以上延续"],["leader","龙头股表态（涨停/新高）"],["idx5","三大指数均站上5日线"],["nocb","连板无核按钮/无天地板"]];
 let risk=[["tech","科技板块集体大跌"],["stagnant","量比 > 4.0 且指数不涨"],["up800","上涨家数 < 800"],["kill","高位人气票出现3个以上跌停"]];

function n(v){let x=Number(v);return Number.isFinite(x)?x:0}
function yuan(v){return "¥"+n(v).toFixed(2)}
function percent(v){return n(v).toFixed(2)+"%"}
function holdingCalc(d){
 let marketValue=0,costValue=0;
 (d.holdings||[]).forEach(h=>{marketValue+=n(h.qty)*n(h.price);costValue+=n(h.qty)*n(h.cost)});
 return {marketValue,costValue,floatingPnl:marketValue-costValue}
}
function recomputeAccount(d){
 d.account=d.account||{initialCapital:"",cash:"",deposit:0,withdraw:0,note:""};
 let h=holdingCalc(d),cash=n(d.account.cash),equity=cash+h.marketValue;
 let capital=n(d.account.initialCapital)+n(d.account.deposit)-n(d.account.withdraw);
 let totalPnl=equity-capital,ret=capital?totalPnl/capital*100:0,pos=equity?h.marketValue/equity*100:0;
 d.accountSnapshot={equity,cash,marketValue:h.marketValue,floatingPnl:h.floatingPnl,totalPnl,returnPct:ret,positionPct:pos,savedAt:d.accountSnapshot?.savedAt||""};
 return d.accountSnapshot
}
function updateClosePrice(i,val){let d=day();if(!d.holdings?.[i])return;d.holdings[i].price=val;recomputeAccount(d);save();render()}
function findHoldingStockOptions(d){
 let seen=new Set(),arr=[];
 (d.holdings||[]).forEach(h=>{if(!seen.has(h.stockId)){seen.add(h.stockId);arr.push({id:h.stockId,name:h.name,code:h.code})}});
 stocksOf(d).forEach(s=>{if(!seen.has(s.id)){seen.add(s.id);arr.push(s)}});
 return arr
}
function recordLedger(type){
 let d=day(),sid=document.getElementById("lg_stock")?.value;
 let qty=n(document.getElementById("lg_qty")?.value),price=n(document.getElementById("lg_price")?.value),fee=n(document.getElementById("lg_fee")?.value),note=document.getElementById("lg_note")?.value||"";
 let srcStock=findHoldingStockOptions(d).find(x=>x.id===sid);
 if(!srcStock||qty<=0||price<=0){showToast("请填写股票、股数和成交价");return}
 let h=(d.holdings||[]).find(x=>x.stockId===sid),realizedPnl=0;
 if(type==="买入"||type==="加仓"){
   if(!h){h={id:id(),stockId:sid,name:srcStock.name||"",code:srcStock.code||"",qty:0,cost:0,price:price};d.holdings.push(h)}
   let oq=n(h.qty),oc=n(h.cost),nq=oq+qty;
   h.cost=nq?((oq*oc)+(qty*price)+fee)/nq:0;h.qty=nq;h.price=price;
   d.account.cash=n(d.account.cash)-(qty*price+fee)
 }else{
   if(!h||qty>n(h.qty)){showToast("卖出数量超过当前持仓");return}
   realizedPnl=(price-n(h.cost))*qty-fee;h.qty=n(h.qty)-qty;h.price=price;
   d.account.cash=n(d.account.cash)+(qty*price-fee)
 }
 d.ledger.push({id:id(),date:d.date,type,stockId:sid,name:srcStock.name||h?.name||"",code:srcStock.code||h?.code||"",qty,price,fee,amount:qty*price,realizedPnl,note,createdAt:new Date().toISOString()});
 d.holdings=d.holdings.filter(x=>n(x.qty)>0);recomputeAccount(d);save();showToast(type+"已记录");render()
}
function deleteLedger(i){let d=day();if(!confirm("确定删除这条交易流水吗？"))return;d.ledger.splice(i,1);recomputeAccount(d);save();render()}
function saveAccountSnapshot(){let d=day();let s=recomputeAccount(d);s.savedAt=new Date().toISOString();save();showToast("今日账户快照已保存");render()}
function equityPoints(){
 var out=[];
 for(var i=0;i<state.days.length;i++){
   var d=state.days[i]||{},s=d.accountSnapshot||{};
   if(s.savedAt){
     out.push({date:d.date||"",equity:n(s.equity),ret:n(s.returnPct)});
   }
 }
 out.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
 return out
}
function equityChart(){
 let a=equityPoints();if(!a.length)return '<p class="hint">暂无账户快照。每天收盘更新价格后，点击“保存今日账户快照”。</p>';
 let W=760,H=250,P=38,ys=a.map(x=>x.equity),mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn)mx=mn+1;
 let pts=a.map((q,i)=>{let x=P+(a.length===1?(W-2*P)/2:(W-2*P)*i/(a.length-1));let y=H-P-(H-2*P)*(q.equity-mn)/(mx-mn);return{x,y,q}});
 return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:640px;height:260px"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="currentColor" opacity=".2"/><polyline fill="none" stroke="currentColor" stroke-width="3" points="${pts.map(p=>p.x+","+p.y).join(" ")}"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5"><title>${p.q.date} · ${yuan(p.q.equity)} · ${percent(p.q.ret)}</title></circle>`).join("")}<text x="${P}" y="20" font-size="12">最高 ${yuan(mx)}</text><text x="${P}" y="${H-8}" font-size="12">最低 ${yuan(mn)}</text></svg></div>`
}

function sellPage(d){let s=currentStock(d);return wrap("⑩ 卖出",`<p class="muted">卖出记录是一笔独立交易。选择哪只股票，就自动使用那只股票在⑥个股里设定的交易模式。</p><p class="hint">如果⑥个股里的模式后来改了，不会偷偷改历史交易；历史交易保存自己的模式快照，并可在⑫统计中心人工修正。</p><div class="grid"><div><label>卖出股票</label><select id="sellStock" onchange="syncSellStock(this.value)">${stocksOf(d).map(x=>`<option value="${x.id}" ${(d.sell.stockId===x.id||( !d.sell.stockId && s&&s.id===x.id))?"selected":""}>${x.name||"未命名"} ${x.code?"· "+x.code:""}</option>`).join("")}</select></div><div><label>对应交易模式</label><input id="sellModelPreview" value="${stockModel(d.sell.stockId||(s&&s.id))||"尚未设置"}" disabled></div>${input(d.sell,"sellPrice","卖出价","number")} ${input(d.sell,"returnPct","实际收益率 %","number")}</div>${text(d.sell,"reason","卖出理由")}<button class="btn" onclick="saveTrade()">记录卖出/交易</button><h3>今日已记录交易</h3><div class="tableWrap"><table><tr><th>股票</th><th>模式</th><th>收益</th><th>时间</th></tr>${(d.trades||[]).map(t=>`<tr><td>${t.name||"—"}</td><td>${t.model||"—"}</td><td>${t.returnPct}%</td><td>${t.createdAt?new Date(t.createdAt).toLocaleTimeString():"—"}</td></tr>`).join("")||"<tr><td colspan=4>尚无交易记录</td></tr>"}</table></div>`)}
function syncSellStock(id){let d=day();d.sell.stockId=id;document.getElementById("sellModelPreview").value=stockModel(id)||"尚未设置";save()}
function reviewPage(d){return wrap("⑪ 复盘 + 博主",`<p class="muted">三大复盘柱：定主流板块 → 判情绪时机 → 抓领涨龙头。</p><p class="hint">复盘重点记录：今天做对什么、违反什么、市场最重要的变化，以及明天只做什么/不做什么。博主内容仅手动记录，不自动抓取社交媒体。</p>${text(d.review,"summary","今日复盘总结")}<div class="grid"><div><label>SOP执行情况</label><select data-area="${d.review._id}" data-key="discipline"><option>完整执行</option><option>部分执行</option><option>SOP例外</option></select></div><div><label>主要错误标签</label><input data-area="${d.review._id}" data-key="error" value="${d.review.error||""}"></div></div><h3>关注博主</h3><div class="grid"><input id="bn" placeholder="博主名称"><select id="bv"><option>看多</option><option>中性</option><option>看空</option></select><input id="bsector" placeholder="关注板块/方向"><input id="bchange" placeholder="持仓变化：新进/增仓/减仓/清仓"></div><textarea id="bnote" placeholder="博主观点/复盘备注"></textarea><button class="btn" onclick="addBlogger()">记录博主</button><table><tr><th>博主</th><th>观点</th><th>方向</th><th>持仓变化</th><th>备注</th></tr>${(d.bloggerLogs||[]).map(x=>`<tr><td>${x.name}</td><td>${x.view}</td><td>${x.sector}</td><td>${x.change}</td><td>${x.note}</td></tr>`).join("")}</table>`)}

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function leaderboardPage(d){
 let lb=bindArea(d.leaderboard);
 const inst=(d.leaderboard.institutions||[]).map((x,i)=>`<tr><td>${esc(x.name)||"—"}</td><td>${esc(x.code)||"—"}</td><td>${esc(x.side)||"—"}</td><td>${esc(x.amount)||"—"}</td><td>${esc(x.seat)||"—"}</td><td>${esc(x.note)||"—"}</td><td><button class="btn danger small" onclick="delRank('institutions',${i})">删除</button></td></tr>`).join("")||"<tr><td colspan=7>尚无机构记录</td></tr>";
 const hot=(d.leaderboard.hotMoney||[]).map((x,i)=>`<tr><td>${esc(x.name)||"—"}</td><td>${esc(x.code)||"—"}</td><td>${esc(x.side)||"—"}</td><td>${esc(x.amount)||"—"}</td><td>${esc(x.seat)||"—"}</td><td>${esc(x.note)||"—"}</td><td><button class="btn danger small" onclick="delRank('hotMoney',${i})">删除</button></td></tr>`).join("")||"<tr><td colspan=7>尚无游资记录</td></tr>";
 return wrap("⑬ 龙虎榜复盘",`
 <p class="muted">只做手动记录，不抓取外部数据。把机构、游资、买卖方向、金额和席位特征留下来，用于验证你的买入逻辑和复盘判断。</p>
 <p class="hint">龙虎榜只是辅助证据，不单独构成买入理由。可重点记录：机构净买/净卖、知名游资席位、是否与主流板块/龙头逻辑共振。</p>
 <h3>机构记录</h3>
 <div class="grid"><input id="ri_name" placeholder="股票名称"><input id="ri_code" placeholder="代码"><select id="ri_side"><option>净买入</option><option>净卖出</option><option>买入</option><option>卖出</option><option>混合</option></select><input id="ri_amount" placeholder="金额/净额"><input id="ri_seat" placeholder="机构席位/数量"></div>
 <textarea id="ri_note" placeholder="机构逻辑、与板块/个股关系"></textarea>
 <button class="btn" onclick="addRank('institutions')">＋ 添加机构记录</button>
 <div class="tableWrap"><table><tr><th>股票</th><th>代码</th><th>方向</th><th>金额</th><th>席位</th><th>备注</th><th></th></tr>${inst}</table></div>
 <h3 style="margin-top:18px">游资记录</h3>
 <div class="grid"><input id="rh_name" placeholder="股票名称"><input id="rh_code" placeholder="代码"><select id="rh_side"><option>净买入</option><option>净卖出</option><option>买入</option><option>卖出</option><option>混合</option></select><input id="rh_amount" placeholder="金额/净额"><input id="rh_seat" placeholder="游资/营业部席位"></div>
 <textarea id="rh_note" placeholder="游资特征、席位联动、是否一日游等"></textarea>
 <button class="btn" onclick="addRank('hotMoney')">＋ 添加游资记录</button>
 <div class="tableWrap"><table><tr><th>股票</th><th>代码</th><th>方向</th><th>金额</th><th>席位</th><th>备注</th><th></th></tr>${hot}</table></div>
 ${text(lb,"notes","龙虎榜总复盘","例如：机构与游资是否同向；是否强化/削弱原交易逻辑。")}
 <button class="btn" onclick="save();showToast('龙虎榜复盘已保存')">保存</button>`);
}
function addRank(kind){
 let d=day(), p=kind==="institutions"?"ri":"rh";
 let item={id:id(),name:document.getElementById(p+"_name").value,code:document.getElementById(p+"_code").value,side:document.getElementById(p+"_side").value,amount:document.getElementById(p+"_amount").value,seat:document.getElementById(p+"_seat").value,note:document.getElementById(p+"_note").value,date:d.date};
 d.leaderboard[kind].push(item); save(); render(); showToast("龙虎榜记录已添加");
}
function delRank(kind,i){let d=day();d.leaderboard[kind].splice(i,1);save();render();}

function statsPage(){
 try{
   var trades=[], ledgers=[], bloggers=[];
   for(var di=0;di<state.days.length;di++){
     var dd=state.days[di]||{};
     var dt=Array.isArray(dd.trades)?dd.trades:[];
     for(var ti=0;ti<dt.length;ti++) trades.push({d:dd,t:dt[ti]||{},i:ti});
     var dl=Array.isArray(dd.ledger)?dd.ledger:[];
     for(var li=0;li<dl.length;li++) ledgers.push(dl[li]||{});
     var db=Array.isArray(dd.bloggerLogs)?dd.bloggerLogs:[];
     for(var bi=0;bi<db.length;bi++) bloggers.push(db[bi]||{});
   }

   var wins=0,sumReturn=0;
   for(var i=0;i<trades.length;i++){
     var rv=Number(trades[i].t.returnPct);
     if(!Number.isFinite(rv))rv=0;
     sumReturn+=rv;if(rv>0)wins++;
   }
   var avg=trades.length?sumReturn/trades.length:0;

   var rows=[];
   for(var mi=0;mi<models.length;mi++){
     var model=models[mi],count=0,w=0,sum=0,minLoss=null;
     for(var j=0;j<trades.length;j++){
       var t=trades[j].t;
       if((t.model||"")===model){
         count++;
         var r=Number(t.returnPct);if(!Number.isFinite(r))r=0;
         sum+=r;if(r>0)w++;if(r<0&&(minLoss===null||r<minLoss))minLoss=r;
       }
     }
     rows.push({m:model,n:count,wr:count?w/count*100:0,av:count?sum/count:0,ml:minLoss===null?0:minLoss});
   }

   var points=equityPoints();
   var last=points.length?points[points.length-1]:null;
   var realized=0,turnover=0;
   for(var k=0;k<ledgers.length;k++){
     realized+=n(ledgers[k].realizedPnl);
     turnover+=n(ledgers[k].amount);
   }

   var bm={};
   for(var b=0;b<bloggers.length;b++){
     var x=bloggers[b],name=x.name||"未命名";
     if(!bm[name])bm[name]={n:0,bull:0};
     bm[name].n++;
     if(x.view==="看多")bm[name].bull++;
   }

   var historyRows="";
   for(var h=0;h<trades.length;h++){
     var rec=trades[h],d=rec.d||{},t=rec.t||{},idx=rec.i;
     var dayId=String(d.id||"").replace(/'/g,"&#39;");
     var tid=String(t.id||"").replace(/'/g,"&#39;");
     var opts="";
     for(var om=0;om<models.length;om++){
       opts+='<option '+((t.model||"")===models[om]?'selected':'')+'>'+models[om]+'</option>';
     }
     var rr=Number(t.returnPct);if(!Number.isFinite(rr))rr=0;
     historyRows+='<tr><td>'+(d.date||"—")+'</td><td>'+(t.name||"—")+'</td><td><select onchange="changeTradeModelById(\''+dayId+'\',\''+tid+'\',this.value,'+idx+')">'+opts+'</select></td><td><input type="number" step="0.01" value="'+rr+'" onchange="changeTradeReturnById(\''+dayId+'\',\''+tid+'\',this.value,'+idx+')" style="min-width:110px"></td><td><button class="btn danger small" onclick="deleteTradeById(\''+dayId+'\',\''+tid+'\','+idx+')">删除</button></td></tr>';
   }
   if(!historyRows)historyRows='<tr><td colspan="5">尚无交易记录</td></tr>';

   var bloggerRows="";
   var names=Object.keys(bm);
   for(var bn=0;bn<names.length;bn++){
     var nm=names[bn],bx=bm[nm];
     bloggerRows+='<tr><td>'+nm+'</td><td>'+bx.n+'</td><td>'+bx.bull+'</td><td>本地历史</td></tr>';
   }
   if(!bloggerRows)bloggerRows='<tr><td colspan="4">尚无记录</td></tr>';

   return wrap("⑫ 统计中心",
     '<p class="muted">V2.7.1：统计页已改为兼容旧数据的防御式计算，不会因为某个旧字段缺失而整页打不开。</p>'+
     '<h3>账户收益</h3>'+
     '<div class="grid">'+
       '<div class="card"><div class="stat">'+(last?yuan(last.equity):"—")+'</div><div class="muted">最新账户权益</div></div>'+
       '<div class="card"><div class="stat">'+(last?percent(last.ret):"—")+'</div><div class="muted">累计账户收益率</div></div>'+
       '<div class="card"><div class="stat">'+yuan(realized)+'</div><div class="muted">累计已实现盈亏</div></div>'+
       '<div class="card"><div class="stat">'+yuan(turnover)+'</div><div class="muted">累计成交金额</div></div>'+
     '</div>'+
     '<h3>账户权益曲线</h3>'+equityChart()+
     '<h3>交易质量</h3>'+
     '<div class="grid">'+
       '<div class="card"><div class="stat">'+trades.length+'</div><div class="muted">交易笔数</div></div>'+
       '<div class="card"><div class="stat">'+(trades.length?(wins/trades.length*100).toFixed(1):"0")+'%</div><div class="muted">胜率</div></div>'+
       '<div class="card"><div class="stat">'+avg.toFixed(2)+'%</div><div class="muted">平均单笔收益</div></div>'+
       '<div class="card"><div class="stat">'+state.days.length+'</div><div class="muted">交易日</div></div>'+
     '</div>'+
     '<h3>交易模式统计</h3><div class="tableWrap"><table class="statsTable"><tr><th>交易模式</th><th>样本数</th><th>胜率</th><th>平均收益</th><th>最大单笔亏损</th></tr>'+
       rows.map(function(x){return '<tr><td><b>'+x.m+'</b></td><td>'+x.n+'</td><td>'+x.wr.toFixed(1)+'%</td><td>'+x.av.toFixed(2)+'%</td><td>'+(x.n?x.ml.toFixed(2)+'%':'—')+'</td></tr>'}).join("")+
     '</table></div>'+
     '<h3>历史交易 · 可编辑 / 删除</h3><p class="hint">实际收益率和模式都可以修正，误录交易可以删除。</p><div class="tableWrap"><table><tr><th>日期</th><th>股票</th><th>当前模式</th><th>实际收益率 %</th><th>操作</th></tr>'+historyRows+'</table></div>'+
     '<h3>博主持仓/观点统计</h3><div class="tableWrap"><table><tr><th>博主</th><th>记录次数</th><th>看多次数</th><th>最近记录</th></tr>'+bloggerRows+'</table></div>'
   );
 }catch(err){
   console.error("TradeOS stats error",err);
   return wrap("⑫ 统计中心",
     '<p class="hint">统计页检测到一条旧数据格式异常，但页面不会再卡死。</p>'+
     '<div class="card"><b>错误信息：</b> '+String(err&&err.message?err.message:err)+'</div>'+
     '<p class="muted">你可以先导出 JSON 备份；把错误信息发给我，我可以继续针对那条旧记录修复。</p>'
   );
 }
}
function changeTradeModelByIndex(dayId,i,val){let d=state.days.find(x=>x.id===dayId);if(d&&d.trades[i]){d.trades[i].model=val;d.trades[i].modelEdited=true;save();showToast('交易模式已修正');render()}}
function changeTradeModelById(dayId,tid,val,i){let d=state.days.find(x=>x.id===dayId);let t=tid?d?.trades?.find(x=>x.id===tid):d?.trades?.[i];if(t){t.model=val;t.modelEdited=true;save();showToast('交易模式已修正');render()}}
function changeTradeReturnById(dayId,tid,val,i){let d=state.days.find(x=>x.id===dayId);let t=tid?d?.trades?.find(x=>x.id===tid):d?.trades?.[i];if(t){t.returnPct=(val===""||val==null)?0:Number(val);t.returnEdited=true;save();showToast("实际收益率已修正");render()}}
function deleteTradeById(dayId,tid,i){let d=state.days.find(x=>x.id===dayId);if(!d)return;let idx=tid?d.trades.findIndex(x=>x.id===tid):i;if(idx>=0&&confirm("确定删除这笔交易记录吗？删除后统计会重新计算。")){d.trades.splice(idx,1);save();showToast("交易记录已删除");render()}}
function bind(){document.querySelectorAll("[data-area]").forEach(e=>e.addEventListener("change",()=>{let id=e.dataset.area;let d=day();let targets=[d.macro,d.market,d.trend,d.emotion,d.sector,...stocksOf(d),d.buy,d.position,d.review,d.sell,d.leaderboard,d.account];let o=targets.find(x=>x._id===id);if(o){o[e.dataset.key]=e.type==="checkbox"?e.checked:e.value;if(o===d.account)recomputeAccount(d);save()}}));document.querySelectorAll("[data-key]:not([data-area])").forEach(e=>{})}
function addHolding(){let d=day(),s=currentStock(d);if(!s){showToast("请先选择股票");return}d.holdings=d.holdings||[];d.holdings.push({id:id(),stockId:s.id,name:s.name||"",code:s.code||"",qty:hq.value,cost:hc.value,price:hp.value});save();render()}
function delHolding(i){day().holdings.splice(i,1);save();render()}
function addBlogger(){let d=day();d.bloggerLogs.push({name:bn.value,view:bv.value,sector:bsector.value,change:bchange.value,note:bnote.value,date:d.date});save();render()}
function saveTrade(){
 let d=day(),sid=document.getElementById("sellStock")?.value||d.sell.stockId||(currentStock(d)&&currentStock(d).id),s=stocksOf(d).find(x=>x.id===sid);
 if(!s){showToast("请先在⑥个股添加股票");return}
 let rp=document.querySelector('[data-area="'+d.sell._id+'"][data-key="returnPct"]');
 let sp=document.querySelector('[data-area="'+d.sell._id+'"][data-key="sellPrice"]');
 let rr=document.querySelector('[data-area="'+d.sell._id+'"][data-key="reason"]');
 d.sell.stockId=sid;
 if(rp)d.sell.returnPct=rp.value;
 if(sp)d.sell.sellPrice=sp.value;
 if(rr)d.sell.reason=rr.value;
 let val=d.sell.returnPct;
 d.trades.push({id:id(),date:d.date,stockId:s.id,name:s.name||"",code:s.code||"",model:s.model||"",modelSource:"stock",returnPct:(val===""||val==null)?0:Number(val),sellPrice:d.sell.sellPrice||"",reason:d.sell.reason||"",createdAt:new Date().toISOString()});
 save();showToast("交易已记录");render()
}
function normalizeDay(d){
 d=d||{}; d.id=d.id||id(); d.date=d.date||today(); d.createdAt=d.createdAt||new Date().toISOString();
 d.macro=d.macro||{}; d.market=d.market||{}; d.trend=d.trend||{}; d.emotion=d.emotion||{phase:""}; d.sector=d.sector||{};
 if(!Array.isArray(d.stocks)){
   d.stocks=[];
   if(d.stock && (d.stock.name||d.stock.code||d.stock.model||Object.keys(d.stock).length)){
     let st={...d.stock,id:d.stock.id||id()};
     st.buy={...(d.buy||st.buy||{})}; st.position={...(d.position||st.position||{})};
     d.stocks.push(st);
   }
 }
 d.stocks=d.stocks||[];
 d.stocks.forEach(st=>{st.id=st.id||id();st.buy=st.buy||{};st.position=st.position||{}});
 d.currentStockId=d.currentStockId||(d.stocks[0]&&d.stocks[0].id)||null;
 d.buy=d.buy||{}; d.position=d.position||{}; d.holdings=d.holdings||[]; d.sell=d.sell||{}; d.ledger=d.ledger||[]; d.account=d.account||{initialCapital:"",cash:"",deposit:0,withdraw:0,note:""}; d.accountSnapshot=d.accountSnapshot||{};
 d.review=d.review||{}; d.bloggerLogs=d.bloggerLogs||[]; d.trades=d.trades||[];
 d.leaderboard=d.leaderboard||{institutions:[],hotMoney:[],notes:""};
 d.leaderboard.institutions=d.leaderboard.institutions||[];
 d.leaderboard.hotMoney=d.leaderboard.hotMoney||[];
 return d;
}
function migratePayload(p){
 if(!p||typeof p!=="object")throw new Error("invalid");
 // 正式 V2.5/V2.6 格式
 if(Array.isArray(p.days)) return {days:p.days.map(normalizeDay),bloggers:Array.isArray(p.bloggers)?p.bloggers:[]};
 // 兼容之前那个有缺陷的 V2.6：current + archive
 if(p.current||Array.isArray(p.archive)){
   let ds=[];
   if(p.current) ds.push(normalizeDay(p.current));
   (p.archive||[]).forEach(x=>ds.push(normalizeDay(x)));
   return {days:ds,bloggers:Array.isArray(p.bloggers)?p.bloggers:[]};
 }
 // 兼容单日对象
 return {days:[normalizeDay(p)],bloggers:[]};
}
function exportData(){let payload={version:"2.6.1",days:state.days,bloggers:state.bloggers||[],exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="TradeOS-backup-"+today()+".json";a.click()}
function importData(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{state=migratePayload(JSON.parse(r.result));selectedDayId=state.days[0]?.id||null;save();ensure();render();showToast("恢复成功")}catch(e){alert("JSON无效或格式无法识别")}};r.readAsText(i.files[0])};i.click()}
load();ensure();render();
</script>
