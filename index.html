let db, currentStep=0, selectedDayId=null, selectedSetupId=null, state={days:[],bloggers:[],setupLibrary:[],tradeCases:[],disciplineChallenges:[],settings:{experimentMaxPositionPct:5,experimentPromotionCases:5}};

function showToast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}

function save(){
 state.version='4.0';state.dataSchemaVersion=2;let d=day();if(d)d.updatedAt=new Date().toISOString();
 try{localStorage.setItem('tradeos_v4_0',JSON.stringify(state));return true}
 catch(e){showToast('保存失败，请立即导出完整备份：'+e.message);return false}
}

function load(){
 for(const key of ['tradeos_v4_0','tradeos_v3_1','tradeos_v3_0_1','tradeos_v3_0','tradeos_v2_9','tradeos_v2_8','tradeos_v2_7_1','tradeos_v2_7','tradeos_v2_6_complete','tradeos_v2','tradeos_v1']){
  const raw=localStorage.getItem(key);if(!raw)continue;
  try{state=migratePayload(JSON.parse(raw));return}catch(e){alert(key+' 读取失败，原数据未覆盖：'+e.message)}

function newDay(){
 const date=today(),existing=state.days.find(d=>d.date===date);
 if(existing){selectedDayId=existing.id;currentStep=0;render();showToast('已打开今天的交易日');return}
 const prev=[...state.days].filter(d=>d.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];
 const d=normalizeDay({date,createdAt:new Date().toISOString()});
 if(prev){
  d.holdings=clone(prev.holdings.filter(h=>n(h.qty)>0));
  d.holdings.forEach(h=>{h.inheritedFrom=prev.date;h.availableQty=h.qty});
  d.stocks=clone(prev.stocks);d.currentStockId=prev.currentStockId;
  d.account=clone(prev.account);d.aiPlan=clone(prev.aiPlan);d.aiPlan.asOf='';
 }
 state.days.push(d);state.days.sort((a,b)=>b.date.localeCompare(a.date));selectedDayId=d.id;
 save();currentStep=0;render();showToast('已建立今日档案，继承持仓和计划')
}

function ensure(){

function n(v){let x=Number(v);return Number.isFinite(x)?x:0}
function yuan(v){return nullable(v)===null?"—":"¥"+n(v).toFixed(2)}
function percent(v){return nullable(v)===null?"—":n(v).toFixed(2)+"%"}
function holdingCalc(d){
 let marketValue=0,costValue=0;
 (d.holdings||[]).forEach(h=>{marketValue+=n(h.qty)*n(h.price);costValue+=n(h.qty)*n(h.cost)});
 return {marketValue,costValue,floatingPnl:marketValue-costValue}
}
function recomputeAccount(d){
 const a=d.account,h=holdingCalc(d),cash=nullable(a.cash);
 const known=d.holdings.every(h=>nullable(h.qty)!==null&&nullable(h.price)!==null);
 const equity=cash!==null&&known?cash+h.marketValue:null;
 const capital=nullable(a.initialCapital)!==null?n(a.initialCapital)+n(a.deposit)-n(a.withdraw):null;
 const totalPnl=equity!==null&&capital!==null?equity-capital:null;
 d.accountSnapshot={equity,cash,marketValue:known?h.marketValue:null,floatingPnl:h.floatingPnl,totalPnl,returnPct:capital>0&&totalPnl!==null?totalPnl/capital*100:null,positionPct:equity>0?h.marketValue/equity*100:null,savedAt:d.accountSnapshot?.savedAt||''};return d.accountSnapshot;
}

 stocksOf(d).forEach(s=>{if(!seen.has(s.id)){seen.add(s.id);arr.push(s)}});
 return arr
}

function equityPoints(){
 var out=[];
 for(var i=0;i<state.days.length;i++){
   var d=state.days[i]||{},s=d.accountSnapshot||{};
   if(s.savedAt&&nullable(s.equity)!==null){
     out.push({date:d.date||"",equity:n(s.equity),ret:n(s.returnPct)});
   }
 }
 out.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
 return out
}
function equityChart(){
 let a=equityPoints();if(!a.length)return '<p class="hint">暂无账户快照。每天收盘更新价格后，点击“保存今日账户快照”。</p>';

 let pts=a.map((q,i)=>{let x=P+(a.length===1?(W-2*P)/2:(W-2*P)*i/(a.length-1));let y=H-P-(H-2*P)*(q.equity-mn)/(mx-mn);return{x,y,q}});

function statsPage(){
 try{
   var trades=[], ledgers=[], bloggers=[];
   for(var di=0;di<state.days.length;di++){
     var dd=state.days[di]||{};
     var dt=Array.isArray(dd.trades)?dd.trades:[];
     for(var ti=0;ti<dt.length;ti++) trades.push({d:dd,t:dt[ti]||{},i:ti});
     var dl=Array.isArray(dd.ledger)?dd.ledger:[];
     for(var li=0;li<dl.length;li++) ledgers.push(dl[li]||{});
     var db=Array.isArray(dd.bloggerLogs)?dd.bloggerLogs:[];
     for(var bi=0;bi<db.length;bi++) bloggers.push(db[bi]||{});
   }

   var measured=trades.filter(x=>nullable(x.t.returnPct)!==null);
   var wins=0,sumReturn=0;
   for(var i=0;i<measured.length;i++){
     var rv=Number(measured[i].t.returnPct);
     if(!Number.isFinite(rv))rv=0;
     sumReturn+=rv;if(rv>0)wins++;
   }
   var avg=measured.length?sumReturn/measured.length:0;

   var rows=[];
   for(var mi=0;mi<models.length;mi++){
     var model=models[mi],count=0,w=0,sum=0,minLoss=null;
     for(var j=0;j<trades.length;j++){
       var t=trades[j].t;
       if((t.model||"")===model&&nullable(t.returnPct)!==null){
         count++;
         var r=Number(t.returnPct);if(!Number.isFinite(r))r=0;
         sum+=r;if(r>0)w++;if(r<0&&(minLoss===null||r<minLoss))minLoss=r;
       }
     }
     rows.push({m:model,n:count,wr:count?w/count*100:0,av:count?sum/count:0,ml:minLoss===null?0:minLoss});
   }

   var points=equityPoints();
   var last=points.length?points[points.length-1]:null;
   var realized=0,turnover=0;
   for(var k=0;k<ledgers.length;k++){
     realized+=n(ledgers[k].realizedPnl);
     turnover+=n(ledgers[k].amount);
   }

   var bm=Object.create(null);
   for(var b=0;b<bloggers.length;b++){
     var x=bloggers[b],name=x.name||"未命名";
     if(!bm[name])bm[name]={n:0,bull:0};
     bm[name].n++;
     if(x.view==="看多")bm[name].bull++;
   }

   var historyRows="";
   for(var h=0;h<trades.length;h++){
     var rec=trades[h],d=rec.d||{},t=rec.t||{},idx=rec.i;
     var dayId=String(d.id||"").replace(/'/g,"&#39;");
     var tid=String(t.id||"").replace(/'/g,"&#39;");
     var opts="";
     for(var om=0;om<models.length;om++){
       opts+='<option '+((t.model||"")===models[om]?'selected':'')+'>'+models[om]+'</option>';
     }
     var rr=nullable(t.returnPct)??'';
     historyRows+='<tr><td>'+(d.date||"—")+'</td><td>'+(t.name||"—")+'</td><td><select onchange="changeTradeModelById(\''+dayId+'\',\''+tid+'\',this.value,'+idx+')">'+opts+'</select></td><td><input type="number" step="0.01" value="'+rr+'" onchange="changeTradeReturnById(\''+dayId+'\',\''+tid+'\',this.value,'+idx+')" style="min-width:110px"></td><td><button class="btn danger small" onclick="deleteTradeById(\''+dayId+'\',\''+tid+'\','+idx+')">删除</button></td></tr>';
   }
   if(!historyRows)historyRows='<tr><td colspan="5">尚无交易记录</td></tr>';

   var bloggerRows="";
   var names=Object.keys(bm);
   for(var bn=0;bn<names.length;bn++){
     var nm=names[bn],bx=bm[nm];
     bloggerRows+='<tr><td>'+nm+'</td><td>'+bx.n+'</td><td>'+bx.bull+'</td><td>本地历史</td></tr>';
   }
   if(!bloggerRows)bloggerRows='<tr><td colspan="4">尚无记录</td></tr>';

   return wrap("⑫ 统计中心",
     '<p class="muted">V4.0：历史交易按实际记录统计；账户曲线使用已保存快照。</p>'+
     '<h3>账户收益</h3>'+
     '<div class="grid">'+
       '<div class="card"><div class="stat">'+(last?yuan(last.equity):"—")+'</div><div class="muted">最新账户权益</div></div>'+
       '<div class="card"><div class="stat">'+(last?percent(last.ret):"—")+'</div><div class="muted">累计账户收益率</div></div>'+
       '<div class="card"><div class="stat">'+yuan(realized)+'</div><div class="muted">累计已实现盈亏</div></div>'+
       '<div class="card"><div class="stat">'+yuan(turnover)+'</div><div class="muted">累计成交金额</div></div>'+
     '</div>'+
     '<h3>账户权益曲线</h3>'+equityChart()+
     '<h3>交易质量</h3>'+
     '<div class="grid">'+
       '<div class="card"><div class="stat">'+trades.length+'</div><div class="muted">交易笔数</div></div>'+
       '<div class="card"><div class="stat">'+(measured.length?(wins/measured.length*100).toFixed(1):"0")+'%</div><div class="muted">胜率（已填收益率）</div></div>'+
       '<div class="card"><div class="stat">'+avg.toFixed(2)+'%</div><div class="muted">平均单笔收益</div></div>'+
       '<div class="card"><div class="stat">'+state.days.length+'</div><div class="muted">交易日</div></div>'+
     '</div>'+
     '<h3>交易模式统计</h3><div class="tableWrap"><table class="statsTable"><tr><th>交易模式</th><th>样本数</th><th>胜率</th><th>平均收益</th><th>最大单笔亏损</th></tr>'+
       rows.map(function(x){return '<tr><td><b>'+x.m+'</b></td><td>'+x.n+'</td><td>'+x.wr.toFixed(1)+'%</td><td>'+x.av.toFixed(2)+'%</td><td>'+(x.n?x.ml.toFixed(2)+'%':'—')+'</td></tr>'}).join("")+
     '</table></div>'+
     '<h3>历史交易 · 可编辑 / 删除</h3><p class="hint">实际收益率和模式都可以修正，误录交易可以删除。</p><div class="tableWrap"><table><tr><th>日期</th><th>股票</th><th>当前模式</th><th>实际收益率 %</th><th>操作</th></tr>'+historyRows+'</table></div>'+
     '<h3>博主持仓/观点统计</h3><div class="tableWrap"><table><tr><th>博主</th><th>记录次数</th><th>看多次数</th><th>最近记录</th></tr>'+bloggerRows+'</table></div>'
   );
 }catch(err){
   console.error("TradeOS stats error",err);
   return wrap("⑫ 统计中心",
     '<p class="hint">统计页检测到一条旧数据格式异常，但页面不会再卡死。</p>'+
     '<div class="card"><b>错误信息：</b> '+String(err&&err.message?err.message:err)+'</div>'+
     '<p class="muted">你可以先导出 JSON 备份；把错误信息发给我，我可以继续针对那条旧记录修复。</p>'
   );
 }
}
function changeTradeModelByIndex(dayId,i,val){let d=state.days.find(x=>x.id===dayId);if(d&&d.trades[i]){d.trades[i].model=val;d.trades[i].modelEdited=true;save();showToast('交易模式已修正');render()}}
function changeTradeModelById(dayId,tid,val,i){let d=state.days.find(x=>x.id===dayId);let t=tid?d?.trades?.find(x=>x.id===tid):d?.trades?.[i];if(t){t.model=val;t.modelEdited=true;save();showToast('交易模式已修正');render()}}
function changeTradeReturnById(dayId,tid,val,i){let d=state.days.find(x=>x.id===dayId);let t=tid?d?.trades?.find(x=>x.id===tid):d?.trades?.[i];if(t){t.returnPct=(val===""||val==null)?null:Number(val);t.returnEdited=true;save();showToast("实际收益率已修正");render()}}
function deleteTradeById(dayId,tid,i){let d=state.days.find(x=>x.id===dayId);if(!d)return;let idx=tid?d.trades.findIndex(x=>x.id===tid):i;if(idx>=0&&confirm("确定删除这笔交易记录吗？删除后统计会重新计算。")){d.trades.splice(idx,1);save();showToast("交易记录已删除");render()}}
function bind(){
 const d=day();if(!d)return;
 const targets=[d.macro,d.market,d.trend,d.emotion,d.sector,d.buy,d.position,d.review,d.sell,d.leaderboard,d.account,d.aiPlan,...d.holdings,...d.stocks.flatMap(s=>[s,s.buy,s.position])];
 document.querySelectorAll('[data-area]').forEach(e=>{
  const o=targets.find(x=>x&&x._id===e.dataset.area);if(!o)return;
  if(e.tagName==='SELECT')e.value=o[e.dataset.key]??'';
  const handler=()=>{

   o[e.dataset.key]=e.type==='checkbox'?e.checked:e.value;o.updatedAt=new Date().toISOString();save();
   if(o===d.market&&e.dataset.key==='volumeRatio')updateVolumeDisplay(o);
};

function migratePayload(p){
 if(!p||typeof p!=='object'||Array.isArray(p)||p.meta?.schemaVersion)throw Error('请选择完整备份，AI分析文件不能用于恢复');
 if(p.dataSchemaVersion>2)throw Error('该备份来自更高数据版本，请勿降级导入');
 for(const k of ['setupLibrary','tradeCases','disciplineChallenges','auditEvents'])if(p[k]!=null&&!Array.isArray(p[k]))throw Error(k+' 应为数组，原数据未覆盖');
 p=clone(p);
 let raw;
 if(Array.isArray(p.days))raw=p.days;
 else if(p.current||Array.isArray(p.archive))raw=[...(p.current?[p.current]:[]),...(p.archive||[])];
 else if(p.date&&['market','holdings','stock','stocks','review'].some(k=>k in p))raw=[p];
 else throw Error('未识别的备份结构');
 const byDate=new Map(),duplicates=clone(p.duplicateArchive||[]);
 for(const item of raw){const d=normalizeDay(item);if(byDate.has(d.date)){
  const old=byDate.get(d.date);duplicates.push({date:d.date,records:[clone(old),clone(d)]});
  byDate.set(d.date,mergeDay(old,d));
 }else byDate.set(d.date,d)}
 const days=[...byDate.values()].sort((a,b)=>b.date.localeCompare(a.date));
 const ids=new Set();days.forEach(d=>{if(ids.has(d.id))d.id=id();ids.add(d.id)});
 const next={...p,version:'4.0',dataSchemaVersion:2,days,bloggers:Array.isArray(p.bloggers)?p.bloggers:[],duplicateArchive:duplicates};
 next.setupLibrary=Array.isArray(p.setupLibrary)?p.setupLibrary:models.map((name,i)=>({id:'legacy-setup-'+(i+1),name,type:name.includes('龙头')?'龙头战法':'传统模式',status:'legacy_needs_definition',currentVersion:1,createdAt:new Date().toISOString(),versions:[{version:1,effectiveAt:new Date().toISOString(),marketConditions:'',emotionPhases:[],sectorConditions:'',stockRoleConditions:'',priceVolumeConditions:'',intradayConditions:'',entryTriggers:[],forbiddenConditions:[],initialPositionPct:null,maxPositionPct:null,addPositionConditions:'',invalidationConditions:'',exitRules:'',fastChecks:[],historicalCases:[],notes:'由旧交易模式自动建立，尚未补充完整规则。'}]}));
 next.tradeCases=Array.isArray(p.tradeCases)?p.tradeCases:[];
 next.disciplineChallenges=Array.isArray(p.disciplineChallenges)?p.disciplineChallenges:[];
 next.settings={experimentMaxPositionPct:5,experimentPromotionCases:5,...object(p.settings)};
 next.days.forEach(d=>{d.stocks.forEach(st=>{if(!st.setupId){const setup=next.setupLibrary.find(x=>x.name===st.model);if(setup)st.setupId=setup.id}});d.trades.forEach(t=>{if(!t.classification)t.classification='legacy_unclassified'})});
 return migrateV4(next);
}

function clone(x){return JSON.parse(JSON.stringify(x))}
function object(x){return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function nullable(v){return v===null||v===undefined||String(v).trim()===''?null:(Number.isFinite(Number(v))?Number(v):null)}
function clean(x){
 if(Array.isArray(x))return x.map(clean);
 if(x&&typeof x==='object')return Object.fromEntries(Object.entries(x).filter(([k])=>!['_id','_editBatch','currentStockId','__name','undoBefore','undoAfter','researchBefore','researchAfter'].includes(k)).map(([k,v])=>[k,clean(v)]));
 return x===''?null:x;
}
function mergeDay(a,b){
 // Input order is authoritative. Preserve all conflicting originals in duplicateArchive.
 function merge(x,y){
  if(x==null||x==='')return clone(y);
  if(Array.isArray(x)&&Array.isArray(y)){
   const seen=new Set();return [...x,...y].filter(v=>{let k=JSON.stringify(clean(v),(key,value)=>key==='id'?undefined:value);if(seen.has(k))return false;seen.add(k);return true});
  }
  if(x&&y&&typeof x==='object'&&typeof y==='object'&&!Array.isArray(x)&&!Array.isArray(y)){
   const out=clone(x);for(const k of Object.keys(y))out[k]=k in out?merge(out[k],y[k]):clone(y[k]);return out;
  }
  return x;
 }
 const d=merge(a,b);d.id=a.id;
 for(const key of ['candidatePool','executionDecisions']){
  const items=new Map();[...(a[key]||[]),...(b[key]||[])].forEach(x=>{const k=x.id||JSON.stringify(x);if(!items.has(k))items.set(k,clone(x))});d[key]=[...items.values()];
 }
 // Holdings are account snapshots, never concatenate two snapshots of the same date.
 d.holdings=clone(a.holdings.length?a.holdings:b.holdings);
 d.stocks=clone(a.stocks);
 for(const st of b.stocks){const old=d.stocks.find(x=>x.id===st.id||(x.code&&x.code===st.code));if(!old)d.stocks.push(clone(st))}
 return normalizeDay(d);
}

  d.holdings=clone(l.undoBefore.holdings);d.account=clone(l.undoBefore.account);
  if(l.researchBefore){state.tradeCases=clone(l.researchBefore.tradeCases);state.disciplineChallenges=clone(l.researchBefore.disciplineChallenges);d.pendingDecisionId=l.researchBefore.pendingDecisionId}
  d.ledger.pop();state.auditEvents.push({id:id(),type:'ledger_undo',ledgerId:l.id,at:nowISO()});recomputeAccount(d);
 })){render();showToast('已撤销；决策票据保留')}
}

const REVIEW_TEXT=[
 ['buyReason','买入理由是什么？'],['withoutCost','如果没有成本价，现在会怎么看？'],
 ['logicStatus','买入逻辑是否仍然成立？'],['failureCause','市场概率还是执行错误？（可同时存在）'],
 ['reusableEntry','是否产生新的可复用买点？']
];
const REVIEW_BOOL=[
 ['planPosition','是否按计划仓位'],['planExit','是否按计划卖出'],['changedPlan','是否临盘改变计划'],
 ['pnlAffectedNext','是否因盈亏影响下一笔'],['shortToLong','是否短线变长线'],
 ['fomo','是否出现FOMO'],['revenge','是否想回本'],['wantWin','是否因太想赢而提高风险']
];
function getTicket(id){return state.days.flatMap(d=>d.executionDecisions||[]).find(t=>t.id===id)}
function caseCategory(c){
 if(c.classification==='legacy_unclassified')return '历史未分类';
 if(c.classification==='experiment')return 'E 实验单'+(c.closedAt?'':' · 未清仓');
 if(!c.closedAt)return '持仓中 · 盈亏未定';
 if(nullable(c.realizedPnl)===null)return '结果待核对';
 if(c.realizedPnl===0)return (c.classification==='system_in'?'系统内':'系统外')+'持平';
 return c.classification==='system_in'?(c.realizedPnl>0?'A 系统内盈利':'B 系统内亏损'):(c.realizedPnl>0?'C 系统外盈利':'D 系统外亏损');
}
function executionScore(c){
 const r=c.review||{};
 if(c.classification==='legacy_unclassified'||!c.closedAt||!r.completedAt)return null;
 const entry=c.entryClassification==='system_in',allBuys=state.days.flatMap(d=>d.ledger).filter(l=>c.ledgerIds.includes(l.id)&&['买入','加仓'].includes(l.type));
 const pos=r.planPosition===true&&allBuys.every(l=>l.executionAssessment?.positionCompliant===true);
 const items=[entry,pos,r.planExit===true,r.changedPlan===false,r.pnlAffectedNext===false];
 return items.filter(Boolean).length*20;
}
function fullyExecuted(c){return c.classification==='system_in'&&executionScore(c)===100}
function reviewResearchPage(){
 const cases=state.tradeCases.filter(c=>!c.voidedAt).slice().reverse(),c=cases.find(x=>x.id===selectedReviewId)||cases[0];
 if(!c)return wrap('逐笔交易研究','<p>真实成交记账后生成案例。旧卖出复盘仍保留，不强行推断下单前条件。</p>');
 selectedReviewId=c.id;const t=getTicket(c.decisionId),r=c.review||{};
 return wrap('逐笔交易研究 · 先过程，后盈亏',`
 ${select4('rv_case','选择交易案例',cases.map(x=>[x.id,(x.name||x.code)+' · '+caseCategory(x)]),c.id,'onchange="selectReview(this.value)"')}
 <div class="reviewHero"><h3>${esc(caseCategory(c))}</h3>${classificationPill(c.classification)}
 <p>Setup：${esc(c.setupName||'历史无可验证Setup')} · 初始分类：${classificationPill(c.entryClassification)}</p>
 <p>净已实现盈亏 ${yuan(c.realizedPnl)} · R ${c.rMultiple==null?'—':n(c.rMultiple).toFixed(2)} · 执行评分 ${executionScore(c)??'待复盘'}</p>
 <p>${c.classification==='system_in'?'系统内失败用于研究概率；卖出执行仍需单独评价。':c.classification==='experiment'?'实验单用于研究新买点，超仓等执行偏差仍保留。':'系统外失败用于改进执行纪律；事后长分析不能改写入场。'}</p></div>
 <details><summary>查看入场事实与原始快照</summary><p>原始理由：${esc(t?.reason||'未记录')}</p><p>原始Setup触发：${esc((t?.setupSnapshot?.rules?.entryTriggers||[]).join('；'))}</p><p>动机标记：${esc((t?.motivationFlags||[]).join('、')||'未标记，不等于不存在')}</p><p>数据截至：${esc(t?.marketSnapshot?.dataAsOf||'未记录')}</p><p>${esc((c.executionWarnings||[]).map(x=>x.text).join('；'))}</p></details>
 <form onsubmit="event.preventDefault();saveCaseReview()">
 <div class="twoCol">${REVIEW_BOOL.map(([k,l])=>select4('rv_'+k,l,[['','待确认'],['true','是'],['false','否']],r[k]===true?'true':r[k]===false?'false':'')).join('')}</div>
 ${REVIEW_TEXT.map(([k,l])=>text4('rv_'+k,l,r[k]??(k==='buyReason'?t?.reason||'':''))).join('')}
 <button class="btn" type="submit">保存并完成本次复盘</button><button class="btn alt" type="button" onclick="saveCaseReview(true)">保存草稿</button>
 </form><p class="hint">复盘修订保留旧版本；完成实验复盘不会自动将案例改为系统内。</p>`);
}
function selectReview(id){selectedReviewId=id;render()}
function saveCaseReview(draft=false){
 const c=state.tradeCases.find(x=>x.id===selectedReviewId);if(!c)return;
 const r={};REVIEW_BOOL.forEach(([k])=>r[k]=valueOf('rv_'+k)===''?null:valueOf('rv_'+k)==='true');REVIEW_TEXT.forEach(([k])=>r[k]=valueOf('rv_'+k));
 if(!draft&&(!c.closedAt||REVIEW_BOOL.some(([k])=>r[k]===null)||REVIEW_TEXT.some(([k])=>!r[k].trim()))){showToast('完成复盘需已清仓，并确认所有问题；暂未完成可以保存草稿');return}
 if(commitV4(()=>{c.reviewHistory=c.reviewHistory||[];if(Object.keys(c.review||{}).length)c.reviewHistory.push(clone(c.review));c.review={...r,updatedAt:nowISO(),completedAt:draft?null:nowISO()}})){showToast(draft?'草稿已保存':'逐笔复盘完成');render()}
}
function startChallenge(){
 if(state.disciplineChallenges.some(x=>x.status==='active')){showToast('已有进行中的挑战');return}
 if(commitV4(()=>{const c={id:id(),startedAt:nowISO(),status:'active',target:20,caseIds:[]};state.disciplineChallenges.push(c);selectedChallengeId=c.id}))render();
}
function finishChallenge(id){
 const ch=state.disciplineChallenges.find(x=>x.id===id);if(!ch)return;
 const cases=[...new Set(ch.caseIds)].map(id=>state.tradeCases.find(x=>x.id===id)).filter(Boolean);
 if(cases.length!==20||cases.some(x=>!x.closedAt||!x.review?.completedAt)){showToast('完成挑战需要20个已清仓且已复盘案例；不按盈亏判断完成');return}
 if(commitV4(()=>{ch.status='completed';ch.completedAt=nowISO()}))render();
}
function challengeMetrics(cases){
 const closed=cases.filter(c=>c.closedAt&&nullable(c.realizedPnl)!==null).sort((a,b)=>a.closedAt.localeCompare(b.closedAt));
 const rs=closed.filter(c=>nullable(c.rMultiple)!==null),wins=rs.filter(c=>c.rMultiple>0),losses=rs.filter(c=>c.rMultiple<0);
 const avg=a=>a.length?a.reduce((s,c)=>s+c.rMultiple,0)/a.length:null;
 let peak=0,cumulative=0,maxDrawdown=0;closed.forEach(c=>{cumulative+=c.realizedPnl;peak=Math.max(peak,cumulative);maxDrawdown=Math.max(maxDrawdown,peak-cumulative)});
 return {closed:closed.length,complete:cases.filter(fullyExecuted).length,systemOut:cases.filter(c=>c.classification==='system_out').length,
  expectancy:avg(rs),rSamples:rs.length,payoff:wins.length&&losses.length?avg(wins)/Math.abs(avg(losses)):null,
  maxDrawdown:closed.length?maxDrawdown:null,
  systemPnl:closed.filter(c=>c.classification==='system_in').reduce((s,c)=>s+c.realizedPnl,0),
  outsidePnl:closed.filter(c=>c.classification==='system_out').reduce((s,c)=>s+c.realizedPnl,0)};
}
function disciplineChallengePage(){
 const ch=state.disciplineChallenges.find(c=>c.id===selectedChallengeId)||state.disciplineChallenges.find(c=>c.status==='active')||state.disciplineChallenges.at(-1);
 if(!ch)return wrap('20笔系统执行挑战','<p>连续记录接下来的20次从建仓到清仓的案例；实验和系统外同样计入，不能挑选盈利样本。</p><button class="btn" onclick="startChallenge()">开始挑战</button>');
 selectedChallengeId=ch.id;const cases=ch.caseIds.map(id=>state.tradeCases.find(x=>x.id===id)).filter(Boolean),m=challengeMetrics(cases);
 const num=v=>v===null?'—':v.toFixed(2);
 const metrics=[['案例进度',cases.length+'/20'],['已清仓',m.closed],['完整执行',m.complete+'/20'],['系统外次数',m.systemOut],['Expectancy',num(m.expectancy)+' R'],['平均盈亏比',num(m.payoff)],['已实现曲线回撤',m.maxDrawdown===null?'—':yuan(m.maxDrawdown)],['系统内净盈亏',yuan(m.systemPnl)],['系统外净盈亏',yuan(m.outsidePnl)]];
 const groups=new Map();cases.forEach(c=>{const key=c.setupId||'unclassified';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(c)});
 return wrap('20笔系统执行挑战 · 执行优先',`
 ${select4('ch_pick','挑战记录',state.disciplineChallenges.map(c=>[c.id,c.startedAt+' · '+c.status]),ch.id,'onchange="selectedChallengeId=this.value;render()"')}
 <p class="philosophy">符合系统但亏钱可以是合格交易；违反系统但赚钱不能抵消执行问题。</p>
 <div class="metrics4">${metrics.map(([l,v])=>`<div class="dashMetric"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div>
 <p class="hint">Expectancy = 已清仓且R已知案例的平均R（${m.rSamples}个样本）；盈亏比 = 平均正R / 平均负R绝对值。无样本显示—。回撤为按清仓时间排序的累计已实现净盈亏回撤（元），不是账户净值回撤。</p>
 <div class="tableWrap"><table><tr><th># / 股票</th><th>战法</th><th>分类</th><th>过程评分</th><th>净盈亏</th><th>R</th><th>研究</th></tr>
 ${cases.map((c,i)=>`<tr><td>${i+1} · ${esc(c.name)}</td><td>${esc(c.setupName||'—')}</td><td>${esc(caseCategory(c))}</td><td>${executionScore(c)??'待完成'}</td><td>${yuan(c.realizedPnl)}</td><td>${num(nullable(c.rMultiple))}</td><td><button class="btn alt small" onclick="selectedReviewId=${arg(c.id)};goStep(12)">复盘</button></td></tr>`).join('')}</table></div>
 <h3>战法样本（含版本变化，查看案例可见入场版本）</h3><div class="tableWrap"><table><tr><th>战法</th><th>已清仓样本</th><th>胜率</th><th>平均R</th></tr>
 ${[...groups.values()].map(g=>{const a=g.filter(c=>c.closedAt&&nullable(c.realizedPnl)!==null);const mm=challengeMetrics(g);return `<tr><td>${esc(g[0].setupName||'未定义')}</td><td>${a.length}</td><td>${a.length?(a.filter(c=>c.realizedPnl>0).length/a.length*100).toFixed(1)+'%':'—'}</td><td>${num(mm.expectancy)}</td></tr>`}).join('')}</table></div>
 <p class="hint">评分：事先系统内入场、实际及自评仓位合规、按计划卖出、无临盘改计划、盈亏不影响下一笔，各20分。未复盘不评分；100分且最终系统内才计完整执行。</p>
 ${ch.status==='active'?`<button class="btn" onclick="finishChallenge(${arg(ch.id)})">完成本轮挑战</button>`:'<button class="btn" onclick="startChallenge()">开始下一轮</button>'}`);
}

function enrichAI(snapshot,d){
 snapshot.meta.schemaVersion='2.0';snapshot.meta.appVersion='4.0';
 snapshot.candidatePool=clean(d.candidatePool);
 snapshot.executionDecisions=clean(d.executionDecisions);
 const ids=new Set([...d.candidatePool.map(c=>c.setupId),...d.executionDecisions.map(c=>c.setupId),...d.stocks.map(s=>s.setupId)]);
 snapshot.setupLibrary=clean(state.setupLibrary.filter(s=>ids.has(s.id)));
 const caseIds=new Set(d.ledger.map(l=>l.tradeCaseId));
 snapshot.tradeCases=clean(state.tradeCases.filter(c=>caseIds.has(c.id)||!c.closedAt));
 snapshot.disciplineChallenges=clean(state.disciplineChallenges);
 snapshot.riskPolicy={experimentMaxPositionPct:5,experimentPromotionCases:5};
 snapshot.dataQuality.notes.push('行情条件是用户声明，未接入实时行情；本地时间戳不是券商或可信服务器证明。','R以首次建仓冻结的初始风险金额为分母，加仓不会重写；缺失初始止损时保持null。');
 return snapshot;
}
function radarMode(){try{return localStorage.getItem('tradeos_radar_mode')||'compact'}catch{return 'compact'}}
function setRadarMode(mode){try{localStorage.setItem('tradeos_radar_mode',mode)}catch{}renderDisciplineRadar(day())}
function renderDisciplineRadar(d){
 let el=document.getElementById('disciplineRadar');if(!el){el=document.createElement('aside');el.id='disciplineRadar';document.body.appendChild(el)}
 if(!d){el.hidden=true;return}el.hidden=false;
 const mode=radarMode(),alerts=dashboardWarnings(d,recomputeAccount(d)),motto=V4_PHILOSOPHY[(Number(d.date.replaceAll('-',''))||0)%V4_PHILOSOPHY.length];
 el.className='radar4 '+mode;
 if(mode==='hidden'){el.innerHTML='<button class="btn alt" aria-label="重新打开纪律提醒" onclick="setRadarMode(\'compact\')">♧ 提醒 '+alerts.length+'</button>';return}
 el.innerHTML=`<div class="radarControls"><button onclick="setRadarMode('expanded')" aria-expanded="${mode==='expanded'}">纪律提醒 · ${alerts.length}条</button><button onclick="setRadarMode('compact')" aria-label="收起提醒">收起</button><button onclick="setRadarMode('hidden')" aria-label="关闭提醒">×</button></div><p>${esc(motto)}</p>${mode==='expanded'?`<ol>${alerts.map(x=>`<li>${esc(x.text)}</li>`).join('')||'<li>暂无提醒；不代表没有风险。</li>'}</ol>`:`<small>${esc(alerts[0]?.text||'暂无记录触发的提醒')}</small>`}`;
}
function mountV4(d){
 document.body.classList.toggle('fast-mode',currentStep===17);
 const main=document.getElementById('app');
 if(currentStep===0||currentStep===1){
  main.insertAdjacentHTML('afterbegin',`<section class="journey4"><div><p class="eyebrow">TRADEOS / V4.0</p><h2>盘前想慢，盘中动快，盘后想透。</h2></div><div class="journeyButtons"><button onclick="goStep(16)">盘前计划<span>候选与预案</span></button><button onclick="goStep(17)">⚡ 盘中执行<span>下单前检查</span></button><button onclick="goStep(12)">盘后研究<span>案例与纪律</span></button></div></section>`);
 }
 if(currentStep===1){
  main.insertAdjacentHTML('beforeend',wrap('今日预期与行动',text(d.aiPlan,'expectation','市场预期')+text(d.aiPlan,'actions','账户待执行计划')));
  bind();
 }
 if(currentStep===10){
  const stock=document.getElementById('lg_stock');stock?.closest('.grid')?.insertAdjacentHTML('beforebegin',ledgerResearchControls(d));
  const t=d.executionDecisions.find(t=>t.id===d.pendingDecisionId);if(t&&stock)stock.value=t.stockId;
 }
 if(currentStep===12)main.insertAdjacentHTML('afterbegin',reviewResearchPage());
 if(currentStep===13)main.insertAdjacentHTML('afterbegin','<div class="card"><button class="btn" onclick="goStep(18)">20笔系统执行挑战</button><p>旧卖出复盘与V4案例分开统计，不将同一成交重复计数。</p></div>');
 if(currentStep===7){
  const picker=main.querySelector('select[data-key="model"]');
  if(picker){const current=currentStock(d);const names=[...new Set([...models,...state.setupLibrary.map(s=>s.name),current?.model].filter(Boolean))];picker.innerHTML='<option value="">请选择</option>'+names.map(x=>option4(x,x,current?.model)).join('');picker.value=current?.model||'';
   picker.addEventListener('change',()=>{if(current){current.setupId=state.setupLibrary.find(x=>x.name===picker.value)?.id||null;save()}})}
 }
 let quick=document.getElementById('quick4');if(!quick){quick=document.createElement('button');quick.id='quick4';quick.className='quick4';quick.textContent='⚡ 极速';quick.onclick=()=>goStep(17);document.body.appendChild(quick)}quick.hidden=currentStep===17;
 const label=document.querySelector('#app>section.card>h2');if(label?.textContent.includes('V3.1'))label.textContent=label.textContent.replace('V3.1','V4.0');
 const edit=main.querySelector('button[onclick="goStep(0)"]');if(currentStep===1&&edit)edit.setAttribute('onclick','goStep(1)');
}

bootV4();
